[general]
output = "nue_1eNp0pi_2602"
primfn = "default_primary_classification"
pidfn = "default_pid"
calofn = "default_calo_ke"
fsthresh = [
    "@photon_threshold",
    "@electron_threshold",
    "@muon_threshold",
    "@pion_threshold",
    "@proton_threshold",
]
recopi0thresh = [
    "@photon_threshold",
    "@leading_photon_threshold",
]

############################################################

[parameters]
photon_threshold = 25.0
electron_threshold = 75.0
muon_threshold = 50.0
pion_threshold = 25.0
proton_threshold = 50.0
pi0_threshold = 0.0

leading_photon_threshold = 40.0
pi0_mass_veto_low = 0.0
pi0_mass_veto_high = 400.0
flash_low_t = -0.5
flash_high_t = 1.6
bnb_fom2_cut = 0.98

############################################################

[[category]] # 0 : Neutrino, Nue CC 1eNp0pi in FV (signal)
cuts = [
    { name = "neutrino" },
    { name = "fiducial_cut"},
    { name = "nonelectron_containment_cut"},
    { name = "single_electron", parameters = [ "@electron_threshold"   ]},
    { name = "no_photons", parameters = [ "@photon_threshold"   ]},
    { name = "no_muons", parameters = [ "@muon_threshold"   ]},
    { name = "!no_protons", parameters = [ "@proton_threshold"   ]},
    { name = "no_charged_pions", parameters = [ "@pion_threshold"   ]}
]

[[category]] # 1 : Neutrino, Nue 1eNp0pi not in FV
cuts = [
    { name = "neutrino" },
    { name = "!fiducial_cut"},
    { name = "single_electron", parameters = [ "@electron_threshold"   ]},
    { name = "no_photons", parameters = [ "@photon_threshold"   ]},
    { name = "no_muons", parameters = [ "@muon_threshold"   ]},
    { name = "!no_protons", parameters = [ "@proton_threshold"   ]}
    { name = "no_charged_pions", parameters = [ "@pion_threshold"   ]}
]


[[category]] # 2 : Neutrino, Other Nue CC
cuts = [
    { name = "neutrino" },
    { name = "iscc"    },
    { name = "single_electron", parameters = [ "@electron_threshold"   ]},
]


[[category]] # 3 : Neutrino, Other Numu CC 
cuts = [
    { name = "neutrino" },
    { name = "iscc" },
    { name = "single_muon", parameters = [ "@muon_threshold" ] },
]


[[category]] # 4 : Neutrino, Other nu NC
cuts = [
    { name = "neutrino" },
    { name = "!iscc"    },
]

[[category]] # 5 : Cosmic
cuts = [
    { name = "!neutrino" },
]
[[category]] # 6 : Neutrino, Other
cuts = [
    { name = "neutrino" },
]

############################################################


[[sample]]
name = "simulation"
# path = "/pnfs/sbnd/persistent/users/mueller/MCP2025B/simulation/mc5e18/input*-reweighted.flat.caf.root"
path = "/pnfs/sbnd/persistent/users/mueller/MCP2025B/simulation/mc1e20/input*-reweighted.flat.caf.root"
ismc = true

[[sample]]
name = "offbeam"
path = "/pnfs/sbnd/persistent/users/mueller/MCP2025B/data/offbeamlight/*.flat.root"
ismc = false

[[sample]]
name = "onbeam"
path = "/pnfs/sbnd/persistent/users/mueller/MCP2025B/data/devsample/*.flat.root"
ismc = false

############################################################

[[tree]]
name = "selected"
sim_only = false
add_systematics = true
mode = "reco"
cut = [
    { name = "valid_flashmatch", type = "reco"},
    { name = "fiducial_cut",     type = "reco" }, 
    { name = "nonelectron_containment_cut",  type = "reco" }, 
    { name = "single_electron",     type = "reco", parameters = [ "@electron_threshold" ] },
    { name = "no_photons",       type = "reco", parameters = [ "@photon_threshold"   ] },
    { name = "no_muons",      type = "reco", parameters = [ "@muon_threshold"     ] },
    { name = "no_charged_pions", type = "reco", parameters = [ "@pion_threshold"     ] },
    { name = "!no_protons",    type = "reco", parameters = [ "@proton_threshold"   ] }
]

branch = [
    {name = "neutrino_id",            type = "true"},
    {name = "cc",                    type = "mctruth"},
    {name = "pdg",                   type = "mctruth"}, 
    {name = "parent_pdg",            type = "mctruth"}, 
    {name = "interaction_type",      type = "mctruth"},
    {name = "neutrino_energy",       type = "mctruth"}, 
    {name = "category",              type = "true"},
    {name = "visible_energy",        type = "both"},
    {name = "fiducial",              type = "reco"},
    {name = "containment",           type = "reco"},
    {name = "flash_time",            type = "reco"},
    {name = "photon_multiplicity",   type = "both", parameters = [ "@photon_threshold"   ]},
    {name = "electron_multiplicity", type = "both", parameters = [ "@electron_threshold" ]},
    {name = "muon_multiplicity",     type = "both", parameters = [ "@muon_threshold"     ]},
    {name = "pion_multiplicity",     type = "both", parameters = [ "@pion_threshold"     ]},
    {name = "proton_multiplicity",   type = "both", parameters = [ "@proton_threshold"   ]},
    {name = "ke",                    type = "both_particle", selector = "leading_electron"   },
    {name = "start_dedx",            type = "reco_particle", selector = "leading_electron"   },
    {name = "start_straightness",    type = "reco_particle", selector = "leading_electron"   },
    {name = "axial_spread",          type = "reco_particle", selector = "leading_electron"   },
    {name = "directional_spread",    type = "reco_particle", selector = "leading_electron"   },
    {name = "vertex_distance",       type = "reco_particle", selector = "leading_electron"   },
    {name = "photon_softmax",        type = "reco_particle", selector = "leading_electron"   },
    {name = "electron_softmax",      type = "reco_particle", selector = "leading_electron"   },
    {name = "muon_softmax",          type = "reco_particle", selector = "leading_proton" },
    {name = "pion_softmax",          type = "reco_particle", selector = "leading_proton" },
    {name = "proton_softmax",        type = "reco_particle", selector = "leading_proton" },
    {name = "primary_softmax",       type = "reco_particle", selector = "leading_electron" },
    { name = "semantic_type",         type = "both_particle", selector = "leading_electron"   },
    { name = "start_x",               type = "both_particle", selector = "leading_electron"   },
    { name = "start_y",               type = "both_particle", selector = "leading_electron"   },
    { name = "start_z",               type = "both_particle", selector = "leading_electron"   },
    { name = "pid",                   type = "both_particle", selector = "leading_electron"   },
    { name = "valid_flashmatch",     type = "reco"},
    { name = "no_muons",             type = "reco", parameters = [ "@muon_threshold"     ] },
    { name = "fiducial_cut",         type = "reco" }, 
    { name = "single_electron",      type = "reco", parameters = [ "@electron_threshold" ] }
]

