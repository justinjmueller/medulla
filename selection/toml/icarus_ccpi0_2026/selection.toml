[general]
output = "icarus_ccpi0_2026"
primfn = "default_primary_classification"
pidfn  = "default_pid"
# calofn_reco = "default_calo_ke"              # nominal
# calofn_reco = "postpi0adj_spineprod_250625_mc_calo_ke"   # CV + systs
# calofn_reco = "postpi0adj_spineprod_250625_data_calo_ke" # data
fsthresh = [
    "@reco_photon_threshold",
    "@reco_electron_threshold",
    "@reco_muon_threshold",
    "@reco_pion_threshold",
    "@reco_proton_threshold",
]
# NOTE: recopi0showerthresh is not yet wired into the new framework.
# The pi0_photon_pair biselector currently hardcodes a 25 MeV shower threshold.
# Porting recopi0showerthresh requires adding a global threshold vector analogous
# to utilities_pi0ana::reco_pi0_shower_thresholds in medulla_pi0.

[parameters]
true_photon_threshold    = 0.0
reco_photon_threshold    = 25.0
true_electron_threshold  = 0.0
reco_electron_threshold  = 0.0
true_muon_threshold      = 143.425
reco_muon_threshold      = 143.425
true_second_muon_threshold = 25.0
reco_second_muon_threshold = 25.0
true_pi0_threshold       = 0.0
reco_pi0_threshold       = 0.0
true_pion_threshold      = 0.0
reco_pion_threshold      = 25.0
true_proton_threshold    = 0.0
reco_proton_threshold    = 0.0
pi0_mass_veto_low        = 60.0
pi0_mass_veto_high       = 300.0
flash_low_t              = -0.5
flash_high_t             =  1.6
bnb_fom_cut              =  0.98

[[sample]]
name = "cv"
path = "/pnfs/icarus/persistent/users/mueller/production/simulation/nominal/input000.flat.root"
ismc = true
disable = false

[[tree]]
name       = "selected"
mode       = "reco"
sim_only   = false
add_exposure = true
cut = [
    {name = "fiducial_cut",              type = "reco"},
    {name = "avoid_icarus_mystery_zgap", type = "reco"},
    {name = "flash_cut",                 type = "reco", parameters = ["@flash_low_t", "@flash_high_t"]},
    {name = "single_muon",               type = "reco", parameters = ["@reco_muon_threshold"]},
    {name = "single_muon",               type = "reco", parameters = ["@reco_second_muon_threshold"]},
    {name = "no_charged_pions",          type = "reco", parameters = ["@reco_pion_threshold"]},
    {name = "two_photons",               type = "reco", parameters = ["@reco_photon_threshold"]},
    {name = "valid_pi0_mass_cut",        type = "reco", parameters = ["@pi0_mass_veto_low", "@pi0_mass_veto_high"]},
]
branch = [
    {name = "neutrino_energy",      type = "mctruth"},
    {name = "vertex_x",             type = "both"},
    {name = "vertex_y",             type = "both"},
    {name = "vertex_z",             type = "both"},
    {name = "pi0_invariant_mass",   type = "both_bivar", biselector = "pi0_photon_pair"},
    {name = "pi0_opening_costheta", type = "both_bivar", biselector = "pi0_photon_pair"},
    {name = "leading_ke",           type = "both_bivar", biselector = "pi0_photon_pair"},
    {name = "leading_dirx",         type = "both_bivar", biselector = "pi0_photon_pair"},
    {name = "leading_diry",         type = "both_bivar", biselector = "pi0_photon_pair"},
    {name = "leading_dirz",         type = "both_bivar", biselector = "pi0_photon_pair"},
]