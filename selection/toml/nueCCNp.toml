[parameters]
trackLength_threshold = 190
photon_threshold = 25.0
electron_threshold = 75.0
muon_threshold = 25.0
pion_threshold = 25.0
proton_threshold = 40.0
electron_dedx = 4.0
flash_low_t = 0.0
flash_high_t = 1.6
vertex_threshold = 3.5
electron_softmax = 0.90
primary_softmax = 0.99
proton_softmax = 0.75
axial_spread = 0.1
electron_id = 1.0
greater_than = 1.0
null_threshold = 0.0
cathode_ke_threshold = 25.0
cathode_offset_threshold = 5.0

[general]
output = "output_nueCCNp_dev"
primfn = "default_primary_classification"
pidfn = "default_pid"
fsthresh = [
    "@trackLength_threshold",
    "@photon_threshold",
    "@electron_threshold",
    "@muon_threshold",
    "@pion_threshold",
    "@proton_threshold",
    "@vertex_threshold",
    "@electron_softmax",
    "@primary_softmax",
    "@flash_low_t",
    "@flash_high_t",
    "@greater_than",
    "@null_threshold",
    "@proton_softmax",
    "@axial_spread",
    "@cathode_ke_threshold",
    "@cathode_offset_threshold"
]

