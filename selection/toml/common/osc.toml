# ══════════════════════════════════════════════════════════════════════
# Centralized catalog of samples employed in First Generation joint
# oscillation analyses.
# 
# Each [[sample]] block has two layers of fields:
#   (1) Operational fields: consumed by the C++ selection code and
#       the Python batch system (name, path, ismc, disable).
#   (2) Metadata fields: provenance and bookkeeping information
#       ignored by the C++ code but used by the campaign system
#       and stored for reproducibility.
#
# The 'key' and 'experiment' fields are metadata for the Python
# campaign tooling and are ignored by the C++ selection executable.
# ══════════════════════════════════════════════════════════════════════

