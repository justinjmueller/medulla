# ═══════════════════════════════════════════════════════════════════
# Centralized sample catalog for medulla selection configurations.
#
# Each [[sample]] block has two layers of fields:
#   (1) Operational fields: consumed by the C++ selection code and
#       the Python batch system (name, path, ismc, disable).
#   (2) Metadata fields: provenance and bookkeeping information
#       ignored by the C++ code but used by the campaign system
#       and stored for reproducibility.
#
# The 'key' and 'experiment' fields are metadata for the Python
# campaign tooling and are ignored by the C++ selection executable.
# ═══════════════════════════════════════════════════════════════════

# ─── SBND Central Value (5e18 POT) ───────────────────────────────
[[sample]]
key = "sbnd_mc5e18"
name = "sbnd"
experiment = "sbnd"
path = "/pnfs/sbnd/persistent/users/mueller/MCP2025B/simulation/mc5e18/*-reweighted.flat.caf.root"
ismc = true

  [sample.metadata]
  description = "SBND central value MC, 5e18 POT sample"
  parent_production = "MCP2025B"
  spine_production = "v03_02_00"
  spine_config = "configs/sbnd_mc_nominal.fcl"
  exposure_pot = 5.0e18

