[parameters]
photon_threshold = 25.0
electron_threshold = 0.0
muon_threshold = 143.425
pion_threshold = 25.0
proton_threshold = 50.0
trackLength_threshold = 190.0
electron_dedx = 3.625
flash_low_t = 0.0
flash_high_t = 9.6

[general]
output = "output_nueCCInclusive"
primfn = "default_primary_classification"
pidfn = "default_pid"
fsthresh = [
    "@photon_threshold",
    "@electron_threshold",
    "@muon_threshold",
    "@pion_threshold",
    "@proton_threshold",
]

# ICARUS MC NuMI Neutrino + Cosmics CV
[[sample]]
name = "NuMIFull"
path = "/pnfs/icarus/persistent/users/dcarber/spine/combined_files/NuMI_CV_flat_cafs_2/*.root"
ismc = true
disable = false # Optional: default = false

# ICARUS debug single file
[[sample]]
name = "debugMC"
#path = "/pnfs/icarus/persistent/users/mueller/production/simulation/cvext/input000.flat.root"
path = "/pnfs/icarus/persistent/users/dcarber/spine/combined_files/NuMI_CV_flat_cafs_2/NuMI_CV_flat_cafs_2_01.root"
ismc = true
disable = true # Optional: default = false

[[tree]]
name = "all"
sim_only = false
mode = "reco"
cut = []
branch = [
    { name = "fiducial_cut",            type = "reco"    },
    { name = "flash_cut",               type = "reco", parameters = [ "@flash_low_t", "@flash_high_t" ] },
    { name = "valid_flashmatch",        type = "reco"    },
    { name = "containment_cut",         type = "reco" },    
    { name = "vertex_distance_cut",     type = "reco", parameters = [ 3.25 ] },
    { name = "track_length",            type = "both", parameters = [ "@trackLength_threshold" ] },
    { name = "containment_cut",         type = "reco_particle", selector = "leading_electron"},
    { name = "particle_dedx",           type = "reco", parameters = [ "@electron_dedx" ] },

    { name = "visible_energy",            type = "reco"},
    { name = "has_particle_multiplicity", type = "reco", parameters = [1, 1] },
    { name = "no_cut",                    type = "reco" },
    { name = "electron_multiplicity",     type = "reco", parameters = [ 0 ] },
    { name = "photon_multiplicity",      type = "reco", parameters = [ 0 ] },
    { name = "muon_multiplicity",        type = "reco", parameters = [ 0 ] },
    { name = "pion_multiplicity",        type = "reco", parameters = [ 0 ] },
    { name = "proton_multiplicity",      type = "reco", parameters = [ 0 ] },
    { name = "no_muons",                 type = "reco", parameters = [ 25.0 ] },
    { name = "no_charged_pions",         type = "reco", parameters = [ 25.0 ] },
    { name = "no_protons",               type = "reco", parameters = [ 25.0 ] },

    { name = "baseline",                 type = "mctruth" },
    { name = "cc",                       type = "mctruth" },
    { name = "pdg",                      type = "mctruth" },
    { name = "neutrino_energy",          type = "mctruth" },
    
    { name = "neutrino_id",               type = "true"    },
    { name = "category",                  type = "true"    },
    { name = "electron_multiplicity",     type = "true", parameters = [ 0 ] },
    { name = "visible_energy",            type = "true"},
    { name = "photon_multiplicity",      type = "true", parameters = [ 0 ] },
    { name = "muon_multiplicity",        type = "true", parameters = [ 0 ] },
    { name = "pion_multiplicity",        type = "true", parameters = [ 0 ] },
    { name = "proton_multiplicity",      type = "true", parameters = [ 0 ] },

    { name = "vertex_distance",          type = "reco_particle", selector = "leading_electron" },
