[[tree]]
name = "eventLevel"
sim_only = false
mode = "event"
cut = []
branch = [
    { name = "ntrue",         type = "event"    },
    { name = "nreco",         type = "event"    },
    { name = "nnu",           type = "event"    },
    { name = "nintime",       type = "event", parameters = [ -0.5, 9.6 ] },
    { name = "nnu_mu",        type = "event"    },
    { name = "nnu_e",         type = "event"    },
]

[[category]] # 0 : Fiducial, contained, electron neutrino CC signal
cuts = [
    { name = "neutrino"        },
    { name = "fiducial_cut"    },
    { name = "iscc"            },
    { name = "neutrino_pdg",        parameters = [ 12.0, -12.0 ] },
]

[[category]] # 1 : Fiducial, contained, other neutrino CC signal
cuts = [
    { name = "neutrino"        },
    { name = "fiducial_cut"    },
    { name = "iscc"            },
    { name = "!neutrino_pdg",        parameters = [ 12.0, -12.0 ] },
]

[[category]] # 2 : Non-fiducial/contained,  neutrino 
cuts = [
    { name = "neutrino"        },
    { name = "iscc"            },
]

[[category]] # 3 : neutral current
cuts = [
    { name = "neutrino"        },
    { name = "!iscc"            },
]

[[category]] # 4 : Cosmic
cuts = [
    { name = "!neutrino"        },
]