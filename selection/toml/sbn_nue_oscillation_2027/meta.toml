[meta]
analysis = "sbn_nue_oscillation"
description = "SBN nue appearance oscillation analysis"
owners = ["noza", "jxia", "mueller"]
experiments = ["sbnd", "icarus"]

[defaults]
batch_size = 50

[[toml]]
role = "primary"
file = "selection.toml"
output_pattern = "spineosc_nue_%e_%t"

  [toml.sys_template]
  sbnd = "sys_sbnd.toml"
  icarus = "sys_icarus.toml"

  [toml.enable.sbnd]
  keys = ["sbnd_ar23p_mc5e18", "sbnd_ar23p_mc1e20", "sbnd_offbeam"]

  [toml.enable.icarus]
  keys = [
    "icarus_ar23p_run2", "icarus_ar23p_run4",
    "icarus_offbeam_run2", "icarus_offbeam_run4"
  ]

[[toml]]
role = "data_blind_safe"
file = "data_blind_safe.toml"
output_pattern = "spineosc_nue_%e_%t_bnblight#"

  [toml.enable.sbnd]
  keys = ["sbnd_bnblight"]

  [toml.enable.icarus]
  keys = ["icarus_bnblight"]
