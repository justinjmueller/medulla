[general]
output = "sbn_nue_oscillation_2027"
primfn = "lax_primary_classification"
pidfn = "default_pid"
fsthresh = [
    "@photon_threshold",
    "@electron_threshold",
    "@muon_threshold",
    "@pion_threshold",
    "@proton_threshold"
]

[parameters]
photon_threshold = 25.0
electron_threshold = 60.0
muon_threshold = 25.0
pion_threshold = 25.0
proton_threshold = 40.0
nonprimary_shower_threshold = 10.0

[[include_samples]]
file = "common/samples.toml"
keys = ["sbnd_bnblight", "icarus_bnblight"]

[[tree]]
name = "selected"
sim_only = false
mode = "reco"
cut = [
    { name = "fiducial_cut",                 type = "reco" },
    { name = "nonelectron_containment_cut",  type = "reco" },
    { name = "valid_flashmatch",             type = "reco" },
    { name = "no_photons",                   type = "reco", parameters = [ "@photon_threshold"   ] },
    { name = "single_electron",              type = "reco", parameters = [ "@electron_threshold" ] },
    { name = "no_charged_pions",             type = "reco", parameters = [ "@pion_threshold"     ] },
    { name = "no_muons",                     type = "reco", parameters = [ "@muon_threshold"     ] },
    { name = "!no_protons",                  type = "reco", parameters = [ "@proton_threshold"   ] },
]

branch = [
    # Interaction-level branches
    { name = "containment_cut",                type = "both"    },
    { name = "dpT",                            type = "reco"    },
    { name = "dalphaT",                        type = "reco"    },
    { name = "dphiT",                          type = "reco"    },
    { name = "dpL",                            type = "reco"    },
    { name = "pn",                             type = "reco"    },
    { name = "vertex_x",                       type = "reco"    },
    { name = "vertex_y",                       type = "reco"    },
    { name = "vertex_z",                       type = "reco"    },
    { name = "photon_multiplicity",            type = "reco",  parameters = [ "@photon_threshold"            ] },
    { name = "electron_multiplicity",          type = "reco",  parameters = [ "@electron_threshold"          ] },
    { name = "pion_multiplicity",              type = "reco",  parameters = [ "@pion_threshold"              ] },
    { name = "muon_multiplicity",              type = "reco",  parameters = [ "@muon_threshold"              ] },
    { name = "proton_multiplicity",            type = "reco",  parameters = [ "@proton_threshold"            ] },
    { name = "nonprimary_shower_multiplicity", type = "reco",  parameters = [ "@nonprimary_shower_threshold" ] },

    # Information for Neutrino 2026
    { name = "cathode_crosser",       type = "both"    },
    { name = "fiducialize_cathode",   type = "both"    },
    { name = "veto_sbnd_highy_highz", type = "both"    },
    { name = "neutrino2026_veto",     type = "both"    },
    { name = "detector",              type = "reco"    },

    # Leading ELECTRON interaction-level
    { name = "azimuthal_angle",                type = "reco_particle", selector = "leading_electron" },
    { name = "dpT",                            type = "reco_particle", selector = "leading_electron" },
    { name = "vertex_distance",                type = "reco_particle", selector = "leading_electron" },
    { name = "electron_softmax",               type = "reco_particle", selector = "leading_electron" },
    { name = "photon_softmax",                 type = "reco_particle", selector = "leading_electron" },
    { name = "primary_softmax",                type = "reco_particle", selector = "leading_electron" },


     # Leading PROTON interaction-level
    { name = "start_x",                        type = "reco_particle", selector = "leading_proton" },
    { name = "start_y",                        type = "reco_particle", selector = "leading_proton" },
    { name = "start_z",                        type = "reco_particle", selector = "leading_proton" },
    { name = "end_x",                          type = "reco_particle", selector = "leading_proton" },
    { name = "end_y",                          type = "reco_particle", selector = "leading_proton" },
    { name = "end_z",                          type = "reco_particle", selector = "leading_proton" },
    { name = "start_dir_x",                    type = "reco_particle", selector = "leading_proton" },
    { name = "start_dir_y",                    type = "reco_particle", selector = "leading_proton" },
    { name = "start_dir_z",                    type = "reco_particle", selector = "leading_proton" },
    { name = "ke",                             type = "reco_particle", selector = "leading_proton" },
    { name = "p",                              type = "reco_particle", selector = "leading_proton" },
    { name = "length",                         type = "reco_particle", selector = "leading_proton" },
    { name = "polar_angle",                    type = "reco_particle", selector = "leading_proton" },
    { name = "azimuthal_angle",                type = "reco_particle", selector = "leading_proton" },
    { name = "primary_softmax",                type = "reco_particle", selector = "leading_proton" },
    { name = "muon_softmax",                   type = "reco_particle", selector = "leading_proton" },
    { name = "pion_softmax",                   type = "reco_particle", selector = "leading_proton" },
    { name = "proton_softmax",                 type = "reco_particle", selector = "leading_proton" }
]