[parameters]
photon_threshold = 25.0
electron_threshold = 300.0
muon_threshold = 100.0
pion_threshold = 25.0
proton_threshold = 50.0
trackLength_threshold = 190.0
electron_dedx = 3.625
flash_low_t = 0.0
flash_high_t = 9.6
vertex_threshold = 3.5
electron_softmax = 0.6
primary_softmax = 0.95
electron_id = 1.0
greater_than = 1.0

[general]
output = "output_nueCCInclusive_nue"
primfn = "default_primary_classification"
pidfn = "default_pid"
fsthresh = [
    "@photon_threshold",
    "@electron_threshold",
    "@muon_threshold",
    "@pion_threshold",
    "@proton_threshold",
    "@vertex_threshold",
    "@electron_softmax",
    "@primary_softmax",
    "@flash_low_t",
    "@flash_high_t",
    "@greater_than",
]

# ICARUS MC NuMI Neutrino + Cosmics CV
[[sample]]
name = "NuMIFull"
#path = "/pnfs/icarus/persistent/users/dcarber/spine/combined_files/NuMI_CV_flat_cafs_2/*.root" # 500k sample
path = "/pnfs/icarus/persistent/users/dcarber/spine/NuMI_CV_ext/v09_89_01_02p02_2/*.flat.root" # extended sample
# path = "/pnfs/icarus/persistent/users/dcarber/spine/NuMI_CV_ext/v09_89_01_02p02_2/larcv_mc_20250806_220150_402928-ead1d4a8-c3f6-4975-a051-235aca4a783f.flat.root" # extended sample
# path = "/pnfs/icarus/persistent/users/dcarber/spine/combined_files/NuMI_CV_flat_cafs_2/NuMI_CV_flat_cafs_2_01.root"
ismc = true
tag = "nominal"
disable = false # Optional: default = false

# ICARUS data beam on (10%)
[[sample]]
name = "data"
path = "/pnfs/icarus/persistent/users/dcarber/spine/NuMI_data_flat_cafs_2/*.flat.root"
#path = "/pnfs/icarus/persistent/users/dcarber/spine/combined_files/NuMI_data_flat_cafs_2/NuMI_data_flat_cafs_2_00.root"
ismc = false
tag = "data"
disable = false # Optional: default = false

# ICARUS data beam off
[[sample]]
name = "dataBeamOff"
path = "/pnfs/icarus/persistent/users/dcarber/spine/NuMI_offbeam_data_flat_cafs/*.flat.root"
#path = "/pnfs/icarus/persistent/users/dcarber/spine/combined_files/NuMI_offbeam_data_flat_cafs/NuMI_offbeam_combined_0.root"
ismc = false
tag = "data"
disable = false # Optional: default = false

