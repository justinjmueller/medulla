[[tree]]
name = "all"
sim_only = false
issignal = false
isdata = false
mode = "reco"
cut = []
branch = [
    { name = "fiducial_cut",            type = "both"    },
    { name = "flash_cut",               type = "both", parameters = [ "@flash_low_t", "@flash_high_t" ] },
    { name = "valid_flashmatch",        type = "both"    },
    { name = "containment_cut",         type = "both" },    
    { name = "vertex_distance_cut",     type = "reco", parameters = [ "@vertex_threshold" ] },
    { name = "track_length",            type = "both", parameters = [ "@trackLength_threshold" ] },
    { name = "containment_cut",         type = "both_particle", selector = "leading_electron"},
    { name = "particle_dedx",           type = "reco", parameters = [ "@electron_dedx" ] },
    { name = "flash_time",              type = "reco"},

    { name = "has_particle_multiplicity", type = "both", parameters = [ 0.0, 2.0, 25.0 ], title = "has_photons"}, 
    { name = "photon_opening_angle",      type = "both"},
    { name = "pi0_invariant_mass",        type = "both"},

    { name= "cut_type",             type = "reco" },
    { name = "is_nu",               type = "reco" },
    { name = "is_data",             type = "reco" },

    { name = "visible_energy",            type = "both"},
    { name = "has_particle_multiplicity", type = "both", parameters = [1, 1] },
    { name = "no_cut",                    type = "both" },
    { name = "electron_multiplicity",     type = "both", parameters = [ 0 ] },
    { name = "photon_multiplicity",      type = "both", parameters = [ "@photon_threshold" ] },
    { name = "muon_multiplicity",        type = "both", parameters = [ 0 ] },
    { name = "pion_multiplicity",        type = "both", parameters = [ 0 ] },
    { name = "proton_multiplicity",      type = "both", parameters = [ 0 ] },
    { name = "no_muons",                 type = "both", parameters = [ "@muon_threshold" ] },
    { name = "no_charged_pions",         type = "both", parameters = [ "@pion_threshold" ] },
    { name = "no_photons",               type = "both", parameters = [ "@photon_threshold" ] },
    { name  = "reco_interaction_type",   type = "reco" },
    { name = "ele_beam_open_angle",      type = "both"},
    { name = "leading_ele_energy_cut",   type = "both", parameters = [ "@electron_threshold" ] },

    { name = "baseline",                 type = "mctruth" },
    { name = "cc",                       type = "mctruth" },
    { name = "pdg",                      type = "mctruth" },
    { name = 'parent_pdg',               type = "mctruth" },
    { name = "neutrino_energy",          type = "mctruth" },
    { name = "interaction_type",         type = "mctruth" },
    { name = "interaction_mode",         type = "mctruth" },
    
    { name = "neutrino_id",               type = "true"    },
    { name = "category",                  type = "true"    },
    { name = "momentum_transfer",        type = "true"},
    { name = "hadronic_invariant_mass",  type = "true"},

    { name = "vertex_distance",          type = "reco_particle", selector = "leading_electron" },
    { name = "ke",                       type = "both_particle", selector = "leading_electron" },
    { name = "calo_ke",                  type = "both_particle", selector = "leading_electron" },
    { name = "mcs_ke",                   type = "both_particle", selector = "leading_electron" },
    { name = "csda_ke",                  type = "both_particle", selector = "leading_electron" },
    { name = "energy",                   type = "both_particle", selector = "leading_electron" },
    { name = "start_dedx",               type = "reco_particle", selector = "leading_electron" },
    { name = "axial_spread",             type = "reco_particle", selector = "leading_electron" },
    { name = "directional_spread",       type = "reco_particle", selector = "leading_electron" },
    { name = "p",                        type = "both_particle", selector = "leading_electron" },

    { name = "start_x",                  type = "both_particle", selector = "leading_electron" },
    { name = "start_y",                  type = "both_particle", selector = "leading_electron" },
    { name = "start_z",                  type = "both_particle", selector = "leading_electron" },
    { name = "end_x",                    type = "both_particle", selector = "leading_electron" },
    { name = "end_y",                    type = "both_particle", selector = "leading_electron" },
    { name = "end_z",                    type = "both_particle", selector = "leading_electron" },
    
    { name = "start_dir_x",              type = "both_particle", selector = "leading_electron" },
    { name = "start_dir_y",              type = "both_particle", selector = "leading_electron" },
    { name = "start_dir_z",              type = "both_particle", selector = "leading_electron" },
    { name = "end_dir_x",                type = "both_particle", selector = "leading_electron" },
    { name = "end_dir_y",                type = "both_particle", selector = "leading_electron" },
    { name = "end_dir_z",                type = "both_particle", selector = "leading_electron" },
    { name = "start_dir_x",              type = "true_particle", selector = "leading_electron" },
    
    { name = "polar_angle",              type = "both_particle", selector = "leading_electron" },
    { name = "azimuthal_angle",          type = "both_particle", selector = "leading_electron" },
    { name = "length",                 type = "both_particle", selector = "leading_electron" },

    { name = "photon_softmax",         type = "reco_particle", selector = "leading_electron" },
    { name = "electron_softmax",       type = "reco_particle", selector = "leading_electron" },
    { name = "muon_softmax",           type = "reco_particle", selector = "leading_electron" },
    { name = "pion_softmax",           type = "reco_particle", selector = "leading_electron" },
    { name = "proton_softmax",         type = "reco_particle", selector = "leading_electron" },
    { name = "mip_softmax",            type = "reco_particle", selector = "leading_electron" },
    { name = "primary_softmax",        type = "reco_particle", selector = "leading_electron" },
    { name = "secondary_softmax",      type = "reco_particle", selector = "leading_electron" },

    { name = "electron_softmax_cut",   type = "reco", parameters = [ "@electron_softmax", "@greater_than" ] },
    { name = "primary_softmax_cut",    type = "reco", parameters = [ "@primary_softmax", "@greater_than" ] },

    { name = "photon_softmax",         type = "reco_particle", selector = "leading_photon"},
    { name = "photon_softmax",         type = "reco_particle", selector = "secondary_photon"},
    { name = "primary_softmax",        type = "reco_particle", selector = "leading_photon"},
    {name = "primary_softmax",         type = "reco_particle", selector = "secondary_photon"},
    { name = "energy",                 type = "both_particle", selector = "leading_photon"},
    { name = "energy",                 type = "both_particle", selector = "secondary_photon"},
    { name = "start_dedx",               type = "reco_particle", selector = "leading_photon" },
    { name = "start_dedx",               type = "reco_particle", selector = "secondary_photon" },
    { name = "axial_spread",             type = "reco_particle", selector = "leading_photon" },
    { name = "axial_spread",             type = "reco_particle", selector = "secondary_photon" },
    { name = "directional_spread",       type = "reco_particle", selector = "leading_photon" },
    { name = "directional_spread",       type = "reco_particle", selector = "secondary_photon" },

    { name = "muon_softmax",           type = "reco_particle", selector = "leading_muon"},
    { name = "primary_softmax",        type = "reco_particle", selector = "leading_muon"},
    { name = "energy",                 type = "reco_particle", selector = "leading_muon"},
    { name = "p",                      type = "reco_particle", selector = "leading_muon"},
    { name = "ke",                     type = "reco_particle", selector = "leading_muon"},

    { name = "pion_softmax",           type = "reco_particle", selector = "leading_pion"},
    { name = "primary_softmax",        type = "reco_particle", selector = "leading_pion"},
    { name = "energy",                 type = "reco_particle", selector = "leading_pion"},
    { name = "p",                      type = "reco_particle", selector = "leading_pion"},
    { name = "ke",                     type = "reco_particle", selector = "leading_pion"},

    { name = "proton_softmax",         type = "reco_particle", selector = "leading_proton"},
    { name = "primary_softmax",        type = "reco_particle", selector = "leading_proton"},
    { name = "energy",                 type = "reco_particle", selector = "leading_proton"},
    { name = "p",                      type = "reco_particle", selector = "leading_proton"},
