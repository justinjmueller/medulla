##############################################
######## Analysis Configuration #############

[general]
# output  = "/pnfs/sbnd/scratch/users/rlazur/rlazur_pi0_biselectors/confusion_matrix"
output = "confusion_matrix"
primfn  = "default_primary_classification"
pidfn   = "default_pid"
calofn  = "default_calo_ke"
fsthresh = [
    "@photon_threshold",
    "@electron_threshold",
    "@muon_threshold",
    "@pion_threshold",
    "@proton_threshold",
]

[parameters]
photon_threshold =          25.0    # photon threshold
leading_photon_threshold =  0.0    # leading photon threshold for pi0 reconstruction
subleading_photon_threshold = 0.0  # subleading photon threshold for pi0 reconstruction
electron_threshold =        0.0     # electron threshold
muon_threshold =            143.425 # muon threshold
pi0_threshold =             0.0     # neutral pion threshold
pion_threshold =            25.0    # charged pion threshold
proton_threshold =          0.0     # proton threshold
pi0_mass_veto_low =         0.0     # pi0 mass veto low
pi0_mass_veto_high =        400.0   # pi0 mass veto high

##########################################
######## Sample Definitions ##############


[[sample]]
name =      "mc"
# path =  "/pnfs/sbnd/persistent/users/mueller/MCP2025B/simulation/mc5e18/input001-reweighted.flat.caf.root"   #test
path =      "/pnfs/sbnd/persistent/users/mueller/MCP2025B/simulation/mc5e18/input*-reweighted.flat.caf.root" #5e18
# path =      "/pnfs/sbnd/persistent/users/mueller/MCP2025B/simulation/mc1e20/input*-reweighted.flat.caf.root"   #1e20
ismc =      true
disable =   false


########################################
######## Categories ####################

[[category]] # 0 : Signal: fiducial, cc, single muon, zero charged pions, single pi0
cuts = [
    {name = "neutrino"},
    {name = "iscc"},
    {name = "fiducial_cut"},
    {name = "fiducialize_cathode"},
    {name = "single_muon",          parameters = ["@muon_threshold"]},
    {name = "no_charged_pions",     parameters = ["@pion_threshold"]},
    {name = "single_pi0",           parameters =  ["@pi0_threshold"]},
]
[[category]] # 1 : Signal: non-fiducial, cc, single muon, zero charged pions, single pi0
cuts = [
    {name = "neutrino"},
    {name = "iscc"},
    {name = "!fiducial_cut"},
    {name = "single_muon",          parameters = ["@muon_threshold"]},
    {name = "no_charged_pions",     parameters = ["@pion_threshold"]},
    {name = "single_pi0",           parameters =  ["@pi0_threshold"]},
]
[[category]] # 2 : fiducial, cc, 1 muon, 0 charged pions, > 1 pi0s
cuts = [
    {name = "neutrino"},
    {name = "iscc"},
    {name = "fiducial_cut"},
    {name = "fiducialize_cathode"},
    {name = "single_muon",          parameters = ["@muon_threshold"]},
    {name = "no_charged_pions",     parameters = ["@pion_threshold"]},
    {name = "at_least_one_pi0",     parameters =  ["@pi0_threshold"]},
]
[[category]] # 3: fiducial, cc, 1 muon, > 0 charged pion, 1 pi0
cuts = [
    {name = "neutrino"},
    {name = "iscc"},
    {name = "fiducial_cut"},
    {name = "fiducialize_cathode"},
    {name = "single_muon",          parameters = ["@muon_threshold"]},
    {name = "!no_charged_pions",    parameters = ["@pion_threshold"]},
    {name = "single_pi0",           parameters =  ["@pi0_threshold"]},
]
[[category]] # 4: fiducial, cc, 1 muon, > 0 charged pion, > 1 pi0
cuts = [
    {name = "neutrino"},
    {name = "iscc"},
    {name = "fiducial_cut"},
    {name = "fiducialize_cathode"},
    {name = "single_muon",          parameters = ["@muon_threshold"]},
    {name = "!no_charged_pions",    parameters = ["@pion_threshold"]},
    {name = "at_least_one_pi0",     parameters =  ["@pi0_threshold"]},
]
[[category]] # 5: fiducial, cc, 0 pi0
cuts = [
    {name = "neutrino"},
    {name = "iscc"},
    {name = "fiducial_cut"},
    {name = "fiducialize_cathode"},
    {name = "!at_least_one_pi0",     parameters =  ["@pi0_threshold"]},
]
[[category]] # 6: fiducial, NC, 0 muons, > 0 charged pions, 
cuts = [
    {name = "neutrino"},
    {name = "!iscc"},
    {name = "fiducial_cut"},
    {name = "fiducialize_cathode"},
    {name = "!no_charged_pions",    parameters = ["@pion_threshold"]},
]
[[category]] # 7: fiducial, NC, 
cuts = [
    {name = "neutrino"},
    {name = "!iscc"},
    {name = "fiducial_cut"},
    {name = "fiducialize_cathode"},
]
[[category]] # 8: non-fiducial
cuts = [
    {name = "neutrino"},
    {name = "!fiducial_cut"},
]
[[category]] # 9: Other neutrino
cuts = [
    {name = "neutrino"},
]
[[category]] # 10: Cosmic
cuts = [
    {name = "!neutrino"},
]

########################################
######## Tree Definitions ##############

[[tree]]
name                = "selected"
mode                = "reco"
sim_only            = true 
add_systematics     = false
cut = [
    {name = "valid_flashmatch",             type = "reco"},
    {name = "fiducial_cut",                 type = "reco"},
    {name = "fiducialize_cathode",                 type = "reco"},
    {name = "single_muon",                  type = "reco",  parameters = ["@muon_threshold"]},
    {name = "no_charged_pions",             type = "reco",  parameters = ["@pion_threshold"]},
    {name = "two_photons",                  type = "reco",  parameters = ["@photon_threshold"]},
    {name = "valid_pi0_mass_cut",           type = "reco",  parameters = ["@pi0_mass_veto_low", "@pi0_mass_veto_high"]},
]
branch = [{name = 'pid', type = 'both_particle'}]

[[tree]]
name                = "signal"
mode                = "true"
sim_only            = true 
add_systematics     = false
cut = [
    {name = "neutrino", type = "true"},
    {name = "fiducial_cut", type = "true"},
    {name = "fiducialize_cathode", type = "true"},
    {name = "iscc", type = "true"},
    {name = "single_muon", type = "true", parameters = ["@muon_threshold"]},
    {name = "no_charged_pions", type = "true", parameters = ["@pion_threshold"]},
    {name = "single_pi0",   type = "true", parameters =  ["@pi0_threshold"]},
]
branch = [{name = 'pid', type = 'both_particle'}]