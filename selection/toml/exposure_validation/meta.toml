[meta]
analysis = "exposure_validation"
description = "Validation of beam quality and exposure accounting in SBN"
owners = ["mueller"]
experiments = ["sbnd", "icarus"]

[defaults]
batch_size = 250

[[toml]]
role = "icarus_bnb"
file = "icarus_bnb.toml"

  [toml.enable.icarus]
  keys = ["onbeam_run2", "onbeam_run4", "offbeam_run2", "offbeam_run4"]


[[toml]]
role = "sbnd_bnb"
file = "sbnd_bnb.toml"

  [toml.enable.sbnd]
  keys = ["onbeam_run1", "onbeam_run1_gen2", "offbeam_run1", "offbeam_run1_gen2"]