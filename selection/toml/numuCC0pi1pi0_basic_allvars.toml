    {name = "primary_softmax",   type = "reco_particle", selector = "leading_primary_pion"},
    {name = "secondary_softmax", type = "reco_particle", selector = "leading_primary_pion"},
    {name = "muon_softmax",      type = "reco_particle", selector = "leading_primary_pion"},
    {name = "pion_softmax",      type = "reco_particle", selector = "leading_primary_pion"},
    {name = "proton_softmax",    type = "reco_particle", selector = "leading_primary_pion"},
    {name = "mip_softmax",       type = "reco_particle", selector = "leading_primary_pion"},
    {name = "hadron_softmax",    type = "reco_particle", selector = "leading_primary_pion"},
    {name = "id",                type = "both_particle", selector = "leading_primary_pion"},
    {name = "match_id",          type = "both_particle", selector = "leading_primary_pion"},

    # Proton observables
    {name = "ke",                type = "both_particle", selector = "leading_proton"},
    {name = "primary_softmax",   type = "reco_particle", selector = "leading_proton"},
    {name = "secondary_softmax", type = "reco_particle", selector = "leading_proton"},
    {name = "muon_softmax",      type = "reco_particle", selector = "leading_proton"},
    {name = "pion_softmax",      type = "reco_particle", selector = "leading_proton"},
    {name = "proton_softmax",    type = "reco_particle", selector = "leading_proton"},
    {name = "mip_softmax",       type = "reco_particle", selector = "leading_proton"},
    {name = "hadron_softmax",    type = "reco_particle", selector = "leading_proton"},
]

[[tree]]
name = "purity"
sim_only = true
mode = "reco"
cut = [
    { name = "no_cut",                type = "reco" },
]
branch = [
    # Generic interaction-level information
    { name = "category",              type = "true" },
    { name = "neutrino_id",           type = "true" },
    { name = "neutrino_energy",       type = "mctruth" },
    { name = "cc",                    type = "mctruth" },
    { name = "pdg",                   type = "mctruth" },
    { name = "interaction_mode",      type = "mctruth" },
    { name = "interaction_type",      type = "mctruth" },
    { name = "W",                     type = "mctruth" },
    { name = "q0",                    type = "mctruth" },
    { name = "q3",                    type = "mctruth" },

    # Quantities for building differential plots
    { name = "vertex_x",              type = "both" },
    { name = "vertex_y",              type = "both" },
    { name = "vertex_z",              type = "both" },
    { name = "pn",                    type = "both" },
    { name = "dpT",                   type = "both" },
    { name = "dalphaT",               type = "both" },
    { name = "dphiT",                 type = "both" },
    { name = "dpL",                   type = "both" },
    { name = "visible_energy",        type = "both" },
    {name = "pi0_invariant_mass",       type = "reco_bivar", biselector = "pi0_photon_pair"},  # -> reco_bivar_pi0_photon_pair_pi0_invariant_mass (MeV)
    {name = "pi0_opening_costheta",     type = "both_bivar", biselector = "pi0_photon_pair"},
    {name = "leading_ke",               type = "both_bivar", biselector = "pi0_photon_pair"},
    {name = "subleading_ke",            type = "both_bivar", biselector = "pi0_photon_pair"},
    
    # Selection cuts (for calculating purity)
    {name = "valid_flashmatch",             type = "reco"},
    {name = "fiducial_cut",                 type = "both"},
    {name = "fiducialize_cathode",          type = "both"},
    {name = "single_muon",                  type = "both",  parameters = ["@muon_threshold"]},
    {name = "no_charged_pions",             type = "both",  parameters = ["@pion_threshold"]},
    {name = "two_photons",                  type = "both",  parameters = ["@photon_threshold"]},
    {name = "valid_pi0_mass_cut",           type = "both",  parameters = ["@pi0_mass_veto_low", "@pi0_mass_veto_high"]},
]