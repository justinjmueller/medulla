########################################
######## Tree Definitions ##############

[[tree]]
name                = "selected"
mode                = "reco"
sim_only            = false 
add_systematics     = false
cut = [
    {name = "valid_flashmatch",             type = "reco"},
    {name = "fiducial_cut",                 type = "reco"},
    {name = "fiducialize_cathode",          type = "reco"},
    {name = "single_muon",                  type = "reco",  parameters = ["@muon_threshold"]},
    {name = "no_charged_pions",             type = "reco",  parameters = ["@pion_threshold"]},
    {name = "two_photons",                  type = "reco",  parameters = ["@photon_threshold"]},
    {name = "valid_pi0_mass_cut",           type = "reco",  parameters = ["@pi0_mass_veto_low", "@pi0_mass_veto_high"]},
]
branch = [
    
    # Cuts - For Efficiency Calculation
    {name = "fiducial_cut",                 type = "true"},
    {name = "fiducialize_cathode",          type = "true"},
    {name = "single_muon",                  type = "true",  parameters = ["@muon_threshold"]},
    {name = "no_charged_pions",             type = "true",  parameters = ["@pion_threshold"]},
    {name = "two_photons",                  type = "true",  parameters = ["@photon_threshold"]},
    {name = "valid_pi0_mass_cut",           type = "true",  parameters = ["@pi0_mass_veto_low", "@pi0_mass_veto_high"]},

    # MC Truth interaction info
    {name = "neutrino_id",              type = "true"},
    {name = "pdg",                      type = "mctruth"},
    {name = "baseline",                 type = "mctruth"},
    {name = "cc",                       type = "mctruth"},
    {name = "neutrino_energy",          type = "mctruth"},
    {name = "interaction_type",         type = "mctruth"},
    {name = "category",                 type = "true"},

    # # Event-level Variables
    {name = "visible_energy",           type = "both"},    
    {name = "containment",              type = "both"},
    {name = "fiducial",                 type = "true"},
    {name = "photon_multiplicity",      type = "both",  parameters = ["@photon_threshold"]},
    {name = "electron_multiplicity",    type = "both",  parameters = ["@electron_threshold"]},
    {name = "muon_multiplicity",        type = "both",  parameters = ["@muon_threshold"]},
    {name = "pion_multiplicity",        type = "both",  parameters = ["@pion_threshold"]},
    {name = "proton_multiplicity",      type = "both",  parameters = ["@proton_threshold"]},

    # # Kinematics
    {name = "vertex_x",                 type = "both"},
    {name = "vertex_y",                 type = "both"},
    {name = "vertex_z",                 type = "both"}, 

    # # Interaction variables
    {name = "Q2",                       type = "both"},
    {name = "W",                        type = "both"},
    {name = "W_calosub",                type = "both"},

    # # TKI
    {name = "dpT",                      type = "both"},
    {name = "dpL",                      type = "both"},
    {name = "pn",                       type = "both"},
    {name = "dphiT",                    type = "both"},
    {name = "dalphaT",                  type = "both"},

    # # Pi0 variables
    {name = "pi0_invariant_mass",       type = "reco_bivar", biselector = "pi0_photon_pair"},
    {name = "pi0_momentum_mag",         type = "both_bivar", biselector = "pi0_photon_pair"},    
    # {name = "pi0_mass_max",             type = "both_bivar", biselector = "pi0_photon_pair"},
    {name = "pi0_beam_costheta",        type = "both_bivar", biselector = "pi0_photon_pair"},
    {name = "pi0_opening_costheta",     type = "both_bivar", biselector = "pi0_photon_pair"},
    {name = "leading_conv_dist",        type = "both_bivar", biselector = "pi0_photon_pair"},
    {name = "subleading_conv_dist",     type = "both_bivar", biselector = "pi0_photon_pair"},
    {name = "leading_ke",               type = "both_bivar", biselector = "pi0_photon_pair"},
    {name = "subleading_ke",            type = "both_bivar", biselector = "pi0_photon_pair"},
    {name = "leading_dirx",             type = "both_bivar", biselector = "pi0_photon_pair"},
    {name = "leading_diry",             type = "both_bivar", biselector = "pi0_photon_pair"},
    {name = "leading_dirz",             type = "both_bivar", biselector = "pi0_photon_pair"},

    # Muon variables
    {name = "ke",                   type = "both_particle", selector = "leading_muon"},
    {name = "azimuthal_angle",      type = "both_particle", selector = "leading_muon"},
    {name = "polar_angle",          type = "both_particle", selector = "leading_muon"},
    {name = "length",               type = "both_particle", selector = "leading_muon"},
    {name = "primary_softmax",      type = "reco_particle", selector = "leading_muon"},
    {name = "secondary_softmax",    type = "reco_particle", selector = "leading_muon"},
    {name = "muon_softmax",         type = "reco_particle", selector = "leading_muon"},
    {name = "pion_softmax",         type = "reco_particle", selector = "leading_muon"},
    {name = "proton_softmax",       type = "reco_particle", selector = "leading_muon"},
    {name = "mip_softmax",          type = "reco_particle", selector = "leading_muon"},
    {name = "hadron_softmax",       type = "reco_particle", selector = "leading_muon"},
    {name = "containment",          type = "both_particle", selector = "leading_muon"},
    {name = "start_x",              type = "both_particle", selector = "leading_muon"},
    {name = "start_y",              type = "both_particle", selector = "leading_muon"},
    {name = "start_z",              type = "both_particle", selector = "leading_muon"},
    {name = "end_x",                type = "both_particle", selector = "leading_muon"},
    {name = "end_y",                type = "both_particle", selector = "leading_muon"},
    {name = "end_z",                type = "both_particle", selector = "leading_muon"},
    {name = "start_dir_x",          type = "both_particle", selector = "leading_muon"},
    {name = "start_dir_y",          type = "both_particle", selector = "leading_muon"},
    {name = "start_dir_z",          type = "both_particle", selector = "leading_muon"},
    {name = "end_dir_x",            type = "both_particle", selector = "leading_muon"},
    {name = "end_dir_y",            type = "both_particle", selector = "leading_muon"},
    {name = "end_dir_z",            type = "both_particle", selector = "leading_muon"},
    {name = "px",                   type = "both_particle", selector = "leading_muon"},
    {name = "py",                   type = "both_particle", selector = "leading_muon"},
    {name = "pz",                   type = "both_particle", selector = "leading_muon"},

    # Pion observables
    {name = "ke",                type = "both_particle", selector = "leading_primary_pion"},
    {name = "primary_softmax",   type = "reco_particle", selector = "leading_primary_pion"},
    {name = "secondary_softmax", type = "reco_particle", selector = "leading_primary_pion"},
    {name = "muon_softmax",      type = "reco_particle", selector = "leading_primary_pion"},
    {name = "pion_softmax",      type = "reco_particle", selector = "leading_primary_pion"},
    {name = "proton_softmax",    type = "reco_particle", selector = "leading_primary_pion"},
    {name = "mip_softmax",       type = "reco_particle", selector = "leading_primary_pion"},
    {name = "hadron_softmax",    type = "reco_particle", selector = "leading_primary_pion"},
    {name = "id",                type = "both_particle", selector = "leading_primary_pion"},
    {name = "match_id",          type = "both_particle", selector = "leading_primary_pion"},

    # Proton observables
    {name = "ke",                type = "both_particle", selector = "leading_proton"},
    {name = "primary_softmax",   type = "reco_particle", selector = "leading_proton"},
    {name = "secondary_softmax", type = "reco_particle", selector = "leading_proton"},
    {name = "muon_softmax",      type = "reco_particle", selector = "leading_proton"},
    {name = "pion_softmax",      type = "reco_particle", selector = "leading_proton"},
    {name = "proton_softmax",    type = "reco_particle", selector = "leading_proton"},
    {name = "mip_softmax",       type = "reco_particle", selector = "leading_proton"},
    {name = "hadron_softmax",    type = "reco_particle", selector = "leading_proton"},
]

