##############################################
######## Analysis Configuration #############

[general]
output  = "test/basic_allvars_test"
# output  = "/pnfs/sbnd/scratch/users/rlazur/basic_hists/basic_output_5e18_onbeam_offbeam"
primfn  = "default_primary_classification"
pidfn   = "default_pid"
calofn  = "default_calo_ke"
fsthresh = [
    "@photon_threshold",
    "@electron_threshold",
    "@muon_threshold",
    "@pion_threshold",
    "@proton_threshold",
]

[parameters]
photon_threshold =          25.0    # photon threshold
leading_photon_threshold =  0.0    # leading photon threshold for pi0 reconstruction
subleading_photon_threshold = 0.0  # subleading photon threshold for pi0 reconstruction
electron_threshold =        0.0     # electron threshold
muon_threshold =            143.425 # muon threshold
pi0_threshold =             0.0     # neutral pion threshold
pion_threshold =            25.0    # charged pion threshold
proton_threshold =          0.0     # proton threshold
pi0_mass_veto_low =         0.0     # pi0 mass veto low
pi0_mass_veto_high =        400.0   # pi0 mass veto high

##########################################
######## Sample Definitions ##############


[[sample]]
name =      "mc"
path =      "/pnfs/sbnd/persistent/users/mueller/MCP2025B/simulation/mc5e18/input001-reweighted.flat.caf.root"   #test
# path =      "/pnfs/sbnd/persistent/users/mueller/MCP2025B/simulation/mc5e18/input*-reweighted.flat.caf.root" #5e18
# path =      "/pnfs/sbnd/persistent/users/mueller/MCP2025B/simulation/mc1e20/input*-reweighted.flat.caf.root"   #1e20
ismc =      true
disable =   false

[[sample]]
name =      "onbeam"
path =      "/pnfs/sbnd/persistent/users/mueller/MCP2025B/data/devsample/*.flat.root"
ismc =      false
disable =   true

[[sample]]
name =      "offbeam"
path =      "/pnfs/sbnd/persistent/users/mueller/MCP2025B/data/offbeamlight/*.flat.root"
ismc =      false
disable =   true

########################################
######## Categories ####################

[[category]] # 0 : Signal: fiducial, cc, single muon, zero charged pions, single pi0
cuts = [
    {name = "neutrino"},
    {name = "iscc"},
    {name = "fiducial_cut"},
    {name = "fiducialize_cathode"},
    {name = "single_muon",          parameters = ["@muon_threshold"]},
    {name = "no_charged_pions",     parameters = ["@pion_threshold"]},
    {name = "single_pi0",           parameters =  ["@pi0_threshold"]},
]
[[category]] # 1 : Signal: fiducial, cc, single muon, zero charged pions, 0 pi0s
cuts = [
    {name = "neutrino"},
    {name = "iscc"},
    {name = "fiducial_cut"},
    {name = "fiducialize_cathode"},
