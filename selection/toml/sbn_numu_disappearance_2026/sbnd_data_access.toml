[general]
output = "sbn_numu_disappearance_2026"
primfn = "lax_primary_classification"
pidfn = "boosted_muon_pid"
fsthresh = [
    "@photon_threshold",
    "@electron_threshold",
    "@muon_threshold",
    "@pion_threshold",
    "@proton_threshold",
]

[parameters]
photon_threshold = 25.0
electron_threshold = 25.0
muon_threshold = 143.425
pion_threshold = 25.0
proton_threshold = 50.0
containment_threshold = 10.0
cathode_fiducialization = 5.0
intime_lb = -5.0
intime_ub = 5.0

[[include_samples]]
file = "common/osc.toml"
keys = [
    "sbnd_bnblight",
]

[[tree]]
name = "selected"
sim_only = false
mode = "reco"
cut = [
    { name = "fiducial_cut_osc",      type = "reco" },
    { name = "user_containment_cut",  type = "reco",  parameters = [ "@containment_threshold" ] },
    { name = "no_photons",            type = "reco",  parameters = [ "@photon_threshold"   ] },
    { name = "no_electrons",          type = "reco",  parameters = [ "@electron_threshold" ] },
    { name = "single_muon",           type = "reco",  parameters = [ "@muon_threshold"     ] },
    { name = "no_charged_pions",      type = "reco",  parameters = [ "@pion_threshold"     ] },
    { name = "!no_protons",           type = "reco",  parameters = [ "@proton_threshold"   ] },
]
branch = [
    # Event-level branches
    { name = "largest_flash_pe",      type = "event", parameters = [ "@intime_lb", "@intime_ub" ] },
    { name = "largest_flash_time",    type = "event", parameters = [ "@intime_lb", "@intime_ub" ] },

    # Interaction-level branches
    { name = "visible_energy",        type = "reco"    },
    { name = "energy_qel",            type = "reco"    },
    { name = "dpT",                   type = "reco"    },
    { name = "dalphaT",               type = "reco"    },
    { name = "dphiT",                 type = "reco"    },
    { name = "dpL",                   type = "reco"    },
    { name = "pn",                    type = "reco"    },
    { name = "vertex_x",              type = "reco"    },
    { name = "vertex_y",              type = "reco"    },
    { name = "vertex_z",              type = "reco"    },
    { name = "photon_multiplicity",   type = "reco",  parameters = [ "@photon_threshold"   ] },
    { name = "electron_multiplicity", type = "reco",  parameters = [ "@electron_threshold" ] },
    { name = "pion_multiplicity",     type = "reco",  parameters = [ "@pion_threshold"     ] },
    { name = "muon_multiplicity",     type = "reco",  parameters = [ "@muon_threshold"     ] },
    { name = "proton_multiplicity",   type = "reco",  parameters = [ "@proton_threshold"   ] },

    # DENT Recommendations
    { name = "fiducialize_cathode",   type = "reco",  parameters = [ "@cathode_fiducialization" ] },
    { name = "veto_sbnd_highy_highz", type = "reco"    },
    { name = "neutrino2026_veto",     type = "reco"    },
    { name = "cathode_crosser",       type = "reco"    },
    { name = "detector",              type = "reco"    },

    # Filter EE TPC (ICARUS Run 2 only)
    { name = "user_containment_cut_filterEE",  type = "reco",  parameters = [ "@containment_threshold" ] },

    # Leading MUON interaction-level
    { name = "start_x",               type = "reco_particle", selector = "leading_muon" },
    { name = "start_y",               type = "reco_particle", selector = "leading_muon" },
    { name = "start_z",               type = "reco_particle", selector = "leading_muon" },
    { name = "end_x",                 type = "reco_particle", selector = "leading_muon" },
    { name = "end_y",                 type = "reco_particle", selector = "leading_muon" },
    { name = "end_z",                 type = "reco_particle", selector = "leading_muon" },
    { name = "p",                     type = "reco_particle", selector = "leading_muon" },
    { name = "mcs_csda_diff",         type = "reco_particle", selector = "leading_muon" },
    { name = "calo_csda_diff",        type = "reco_particle", selector = "leading_muon" },
    { name = "polar_angle",           type = "reco_particle", selector = "leading_muon" },
    { name = "azimuthal_angle",       type = "reco_particle", selector = "leading_muon" },
    { name = "azimuthal_angle_dent",  type = "reco_particle", selector = "leading_muon" },
    { name = "primary_softmax",       type = "reco_particle", selector = "leading_muon" },
    { name = "muon_softmax",          type = "reco_particle", selector = "leading_muon" },
    { name = "pion_softmax",          type = "reco_particle", selector = "leading_muon" },
    { name = "proton_softmax",        type = "reco_particle", selector = "leading_muon" },

    # Leading PROTON interaction-level
    { name = "start_x",           type = "reco_particle", selector = "leading_proton" },
    { name = "start_y",           type = "reco_particle", selector = "leading_proton" },
    { name = "start_z",           type = "reco_particle", selector = "leading_proton" },
    { name = "end_x",             type = "reco_particle", selector = "leading_proton" },
    { name = "end_y",             type = "reco_particle", selector = "leading_proton" },
    { name = "end_z",             type = "reco_particle", selector = "leading_proton" },
    { name = "ke",                type = "reco_particle", selector = "leading_proton" },
    { name = "p",                 type = "reco_particle", selector = "leading_proton" },
    { name = "calo_csda_diff",    type = "reco_particle", selector = "leading_proton" },
    { name = "length",            type = "reco_particle", selector = "leading_proton" },
    { name = "dpT",               type = "reco_particle", selector = "leading_proton" },
    { name = "polar_angle",       type = "reco_particle", selector = "leading_proton" },
    { name = "azimuthal_angle",   type = "reco_particle", selector = "leading_proton" },
    { name = "azimuthal_angle_dent", type = "reco_particle", selector = "leading_proton" },
    { name = "primary_softmax",   type = "reco_particle", selector = "leading_proton" },
    { name = "secondary_softmax", type = "reco_particle", selector = "leading_proton" },
    { name = "muon_softmax",      type = "reco_particle", selector = "leading_proton" },
    { name = "pion_softmax",      type = "reco_particle", selector = "leading_proton" },
    { name = "proton_softmax",    type = "reco_particle", selector = "leading_proton" },
    { name = "mip_softmax",       type = "reco_particle", selector = "leading_proton" },
    { name = "hadron_softmax",    type = "reco_particle", selector = "leading_proton" },

    # Muon-Proton
    { name = "opening_angle",     type = "reco_bivar",    biselector = "muon_proton"  },
]

[[tree]]
name = "events"
sim_only = false
mode = "event"
cut = [
    { name = "no_cut",             type = "event" },
]
branch = [
    { name = "is_first_in_subrun", type = "event" },
    { name = "pot",                type = "event" },
    { name = "pot_from_spillinfo", type = "event" },
    { name = "largest_flash_pe",   type = "event", parameters = [ "@intime_lb", "@intime_ub" ] },
    { name = "largest_flash_time", type = "event", parameters = [ "@intime_lb", "@intime_ub" ] },
    { name = "unfolded_pot_bnb",   type = "event" },
    { name = "unfolded_nbnb",      type = "event" },
    { name = "gate_delta",         type = "event" },
    { name = "nbnb",               type = "event" },
    { name = "noffbeambnb",        type = "event" },
    { name = "ngenevt",            type = "event" },
    { name = "nreco",              type = "event" },
    { name = "ntrue",              type = "event" },
]