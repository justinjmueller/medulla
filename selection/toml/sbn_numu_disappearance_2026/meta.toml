[meta]
analysis = "sbn_numu_disappearance_2026"
description = "SBN numu disappearance oscillation analysis"
owners = ["mueller", "dtotani", "msiden"]
experiments = ["sbnd", "icarus"]

[defaults]
batch_size = 50

[[toml]]
role = "primary"
file = "selection.toml"
output_pattern = "spineosc_numu_%e_%t"

  [toml.sys_template]
  sbnd = "sys_sbnd.toml"
  icarus = "sys_icarus.toml"

  [toml.enable.sbnd]
  keys = ["sbnd_ar23p_mc5e18", "sbnd_ar23p_mc1e20", "sbnd_offbeam"]

  [toml.enable.icarus]
  keys = [
    "icarus_ar23p_run2", "icarus_ar23p_run4",
    "icarus_offbeam_run2", "icarus_offbeam_run4"
  ]

[[toml]]
role = "dirt"
file = "selection.toml"
output_pattern = "spineosc_numu_%e_%t_dirt"

  [toml.sys_template]
  sbnd = "sys_sbnd.toml"
  icarus = "sys_icarus.toml"

  [toml.enable.sbnd]
  keys = ["sbnd_ar23p_dirt",]

  [toml.enable.icarus]
  keys = [
    "icarus_ar23p_dirt_run2",
    "icarus_ar23p_dirt_run4",
  ]

[[toml]]
role = "detvar"
file = "selection.toml"
output_pattern = "spineosc_numu_%e_%t_detvar"

  [toml.enable.sbnd]
  keys = [
    "sbnd_intime_mc5e18", "sbnd_intime_mc1e20",
    "sbnd_detvar_cv", "sbnd_detvar_dent",
    "sbnd_detvar_sce0x", "sbnd_detvar_sce2x",
    "sbnd_detvar_charge_scale",
    "sbnd_detvar_p5_gain", "sbnd_detvar_m5_gain", "sbnd_detvar_smear15",
    "sbnd_wiremod_xthetaxw", "sbnd_wiremod_yz",
  ]

  [toml.enable.icarus]
  keys = [
    "icarus_wiremod_xthetaxw_run2", "icarus_wiremod_yz_run2",
    "icarus_wiremod_xthetaxw_run4", "icarus_wiremod_yz_run4",
    "icarus_detvar_sce0x_run4", "icarus_detvar_sce2x_run4",
    "icarus_detvar_charge_scale_run4",
  ]

[[toml]]
role = "data_blind_safe"
file = "data_blind_safe.toml"
output_pattern = "spineosc_numu_%e_%t_bnblight#"

  [toml.enable.sbnd]
  keys = ["sbnd_bnblight"]

  [toml.enable.icarus]
  keys = [
    "icarus_bnblight_run2",
    "icarus_bnblight_run4",
  ]

[[toml]]
role = "data_quality"
file = "data_quality.toml"
experiments = ["sbnd"]

  [toml.enable.sbnd]
  keys = ["sbnd_offbeam",]

  [toml.enable.icarus]
  keys = ["icarus_offbeam_run4",]

[[toml]]
role = "preselection"
file = "preselection.toml"
output_pattern = "spineosc_numu_%e_%t_preselection#"

  [toml.enable.sbnd]
  keys = ["sbnd_ar23p_mc5e18", "sbnd_ar23p_mc1e20", "sbnd_offbeam", "sbnd_bnblight"]

  [toml.enable.icarus]
  keys = ["icarus_ar23p_run4", "icarus_offbeam_run4", "icarus_bnblight_run4"]