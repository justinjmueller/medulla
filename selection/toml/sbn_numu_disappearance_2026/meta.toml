[meta]
analysis = "sbn_numu_disappearance_2026"
description = "SBN numu disappearance oscillation analysis"
owners = ["mueller", "dtotani", "msiden"]
experiments = ["sbnd", "icarus"]

[defaults]
batch_size = 1

[[toml]]
role = "primary"
file = "selection.toml"
output_pattern = "spineosc_numu_%e_%t"

  [toml.enable.sbnd]
  keys = ["sbnd_mc5e18", "sbnd_mc1e20", "sbnd_offbeam"]

  [toml.enable.icarus]
  keys = ["icarus_nominal", "icarus_cvext", "icarus_offbeam"]

[[toml]]
role = "data_blind_safe"
file = "data_blind_safe.toml"
output_pattern = "spineosc_numu_%e_%t_bnblight#"

  [toml.enable.sbnd]
  keys = ["sbnd_bnblight"]

  [toml.enable.icarus]
  keys = ["icarus_bnblight"]

[[toml]]
role = "data_quality"
file = "data_quality.toml"
experiments = ["sbnd"]

  [toml.enable.sbnd]
  keys = ["sbnd_offbeam"]

[[toml]]
role = "preselection"
file = "preselection.toml"
output_pattern = "spineosc_numu_%e_%t_preselection#"

  [toml.enable.sbnd]
  keys = ["sbnd_mc5e18", "sbnd_mc1e20", "sbnd_offbeam", "sbnd_bnblight"]

  [toml.enable.icarus]
  keys = ["icarus_nominal", "icarus_cvext", "icarus_offbeam", "icarus_bnblight"]