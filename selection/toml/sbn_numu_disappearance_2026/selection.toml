[[category]] # 0 : Fiducial, contained, single muon, single proton
cuts = [
    { name = "neutrino"        },
    { name = "fiducial_cut"    },
    { name = "containment_cut" },
    { name = "no_photons",       parameters = [ "@photon_threshold"   ] },
    { name = "no_electrons",     parameters = [ "@electron_threshold" ] },
    { name = "no_charged_pions", parameters = [ "@pion_threshold"     ] },
    { name = "single_muon",      parameters = [ "@muon_threshold"     ] },
    { name = "single_proton",    parameters = [ "@proton_threshold"   ] }
]

[[category]] # 1 : Fiducial, non-contained, single muon, single proton
cuts = [
    { name = "neutrino"         },
    { name = "fiducial_cut"     },
    { name = "!containment_cut" },
    { name = "no_photons",        parameters = [ "@photon_threshold"   ] },
    { name = "no_electrons",      parameters = [ "@electron_threshold" ] },
    { name = "no_charged_pions",  parameters = [ "@pion_threshold"     ] },
    { name = "single_muon",       parameters = [ "@muon_threshold"     ] },
    { name = "single_proton",     parameters = [ "@proton_threshold"   ] }
]

[[category]] # 2 : Fiducial, contained, single muon, N > 1 protons
cuts = [
    { name = "neutrino"         },
    { name = "fiducial_cut"     },
    { name = "containment_cut"  },
    { name = "no_photons",        parameters = [ "@photon_threshold"   ] },
    { name = "no_electrons",      parameters = [ "@electron_threshold" ] },
    { name = "no_charged_pions",  parameters = [ "@pion_threshold"     ] },
    { name = "single_muon",       parameters = [ "@muon_threshold"     ] },
    { name = "multiproton",       parameters = [ "@proton_threshold"   ] }
]

[[category]] # 3 : Fiducial, non-contained, single muon, N > 1 protons
cuts = [
    { name = "neutrino"         },
    { name = "fiducial_cut"     },
    { name = "!containment_cut" },
    { name = "no_photons",        parameters = [ "@photon_threshold"   ] },
    { name = "no_electrons",      parameters = [ "@electron_threshold" ] },
    { name = "no_charged_pions",  parameters = [ "@pion_threshold"     ] },
    { name = "single_muon",       parameters = [ "@muon_threshold"     ] },
    { name = "multiproton",       parameters = [ "@proton_threshold"   ] }
]

[[category]] # 4 : Fiducial, contained, single muon, any protons, X > 0 pions
cuts = [
    { name = "neutrino"         },
    { name = "fiducial_cut"     },
    { name = "containment_cut"  },
    { name = "no_photons",        parameters = [ "@photon_threshold"   ] },
    { name = "no_electrons",      parameters = [ "@electron_threshold" ] },
    { name = "!no_charged_pions", parameters = [ "@pion_threshold"     ] },
    { name = "single_muon",       parameters = [ "@muon_threshold"     ] }
]

[[category]] # 5 : Fiducial, non-contained, single muon, any protons, X > 0 pions
cuts = [
    { name = "neutrino"         },
    { name = "fiducial_cut"     },
    { name = "!containment_cut" },
    { name = "no_photons",        parameters = [ "@photon_threshold"   ] },
    { name = "no_electrons",      parameters = [ "@electron_threshold" ] },
    { name = "!no_charged_pions", parameters = [ "@pion_threshold"     ] },
    { name = "single_muon",       parameters = [ "@muon_threshold"     ] }
]

[[category]] # 6 : Fiducial, CC, non-signal
cuts = [
    { name = "neutrino"     },
    { name = "fiducial_cut" },
    { name = "iscc"         }
]

[[category]] # 7 : Non-fiducial, CC, non-signal
cuts = [
    { name = "neutrino"      },
    { name = "!fiducial_cut" },
    { name = "iscc"          }
]

[[category]] # 8 : NC
cuts = [
    { name = "neutrino" },
    { name = "!iscc"    }
]

[[category]] # 9 : Cosmic
cuts = [
    { name = "!neutrino" }
]