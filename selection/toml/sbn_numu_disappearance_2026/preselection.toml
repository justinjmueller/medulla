[general]
output = "sbn_numu_disappearance_2026"
primfn = "lax_primary_classification"
pidfn = "default_pid"
fsthresh = [
    "@photon_threshold",
    "@electron_threshold",
    "@muon_threshold",
    "@pion_threshold",
    "@proton_threshold",
]

[parameters]
photon_threshold = 25.0
electron_threshold = 25.0
muon_threshold = 143.425
pion_threshold = 25.0
proton_threshold = 50.0

[[include_samples]]
file = "common/samples.toml"
keys = [
    "sbnd_mc5e18", "sbnd_mc1e20", "sbnd_offbeam",
    "icarus_nominal", "icarus_cvext", "icarus_offbeam",
]
# For interactive debugging, uncomment:
# enable = ["sbnd_mc5e18"]

[[tree]]
name = "longest_track"
sim_only = false
mode = "reco"
cut = [
    { name = "fiducial_cut",        type = "reco" },
    { name = "track_multiplicity",  type = "reco", parameters = [ 2 ] },
    { name = "is_longest_track",    type = "reco" },
]
branch = [
    { name = "start_x",          type = "both_particle", selector = "longest_track" },
    { name = "start_y",          type = "both_particle", selector = "longest_track" },
    { name = "start_z",          type = "both_particle", selector = "longest_track" },
    { name = "end_x",            type = "both_particle", selector = "longest_track" },
    { name = "end_y",            type = "both_particle", selector = "longest_track" },
    { name = "end_z",            type = "both_particle", selector = "longest_track" },
    { name = "start_dir_x",      type = "both_particle", selector = "longest_track" },
    { name = "start_dir_y",      type = "both_particle", selector = "longest_track" },
    { name = "start_dir_z",      type = "both_particle", selector = "longest_track" },
    { name = "ke",               type = "both_particle", selector = "longest_track" },
    { name = "p",                type = "both_particle", selector = "longest_track" },
    { name = "length",           type = "both_particle", selector = "longest_track" },
    { name = "polar_angle",      type = "both_particle", selector = "longest_track" },
    { name = "azimuthal_angle",       type = "both_particle", selector = "longest_track" },
    { name = "azimuthal_angle_dent",  type = "both_particle", selector = "longest_track" },
]

