# Phase-2 detector variation systematics TOML.
# Used to apply pre-built splines to individual per-job selection outputs.
# The splines_file must point to the output of a phase-1 run (NuMI_nue_gundam.toml
# applied to the full merged sample), which contains the fitted splines under
# variations.result_destination.
#
# The input.weights field is not used for add_detsys_weights, so it is omitted.

[input]
path = 'output.root'          # rewritten per-job by the runner script
use_additional_hash = true

[output]
path = 'output_detsys.root'   # rewritten per-job by the runner script
histogram_destination = 'variations/'

[variations]
splines_file = 'output_var_sys.root'   # rewritten per-job by the runner script
result_destination = 'detsys_results/'
variable = ['reco_leading_electron_energy', 'reco_ele_beam_open_angle']
bins = [[300, 390, 490, 600, 730, 870, 1030, 1240, 1500, 2000, 5000], [-1.0, -0.4, 0.0, 0.2, 0.35, 0.5, 0.625, 0.725, 0.8, 0.85, 0.9, 0.94, 0.97, 1.0]]
nuniverses = 1000
variable_length = false

[[sysvar]]
name = 'reco_leading_electron_energy'
bins = [300, 390, 490, 600, 730, 870, 1030, 1240, 1500, 2000, 5000]

[[tree]]
origin = 'events/NuMIFull/selected'
destination = 'events/NuMIFull/'
name = 'selected'
action = 'add_detsys_weights'
table_types = ['variation']

[[tree]]
origin = 'events/data/selected'
destination = 'events/data/'
name = 'selected'
action = 'copy'

[[tree]]
origin = 'events/dataBeamOff/selected'
destination = 'events/dataBeamOff/'
name = 'selected'
action = 'copy'

[[sys]]
name = 'induction_high'
type = 'variation'
index = -1
nsigma = [-3, -2, -1, 0, 1, 2, 3]
scale = [-3, -2, -1, 1, 1, 2, 3]
ordinate = 'NuMIFull'
points = ['induction_high', 'induction_high', 'induction_high', 'NuMIFull', 'induction_high', 'induction_high', 'induction_high']

