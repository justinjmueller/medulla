
[[this_includes]]
file = '/nashome/m/micarrig/icarus/nuESpine/medulla/spineplot/configurations/common/styles.toml'

# Define your samples (pre-selection tree so individual cut branches are present)
[samples]
[samples.NuMIFull]
key = "NuMIFull"
exposure_type = 'pot'
trees = ['all']
systematics = []
branches = ["reco_ele_beam_open_angle",
            "true_ele_beam_open_angle",
            "true_category",
            "true_neutrino_energy",
            "true_cc",
            "true_interaction_mode",
            "reco_flash_time",
            "reco_reco_interaction_type",
            "reco_leading_electron_start_x",
            "reco_leading_electron_start_y",
            "reco_leading_electron_start_z",
            "reco_electron_multiplicity",
            "reco_leading_electron_electron_softmax",
            "reco_leading_electron_primary_softmax",
            "reco_muon_multiplicity",
            "reco_leading_electron_vertex_distance",
            "reco_leading_electron_energy",
            "reco_flash_cut",
            "reco_fiducial_cut",
            "reco_containment_cut",
            "reco_has_particle_multiplicity",
            "reco_electron_softmax_cut",
            "reco_primary_softmax_cut",
            "reco_no_muons",
            "reco_vertex_distance_cut",
            "reco_leading_ele_energy_cut",
            "ppfx_cv_weight"
            ]
precompute = {"reco_ele_beam_cosTheta" = "np.cos(reco_ele_beam_open_angle)", "true_ele_beam_cosTheta" = "np.cos(true_ele_beam_open_angle)", "true_mode_category" = "np.where(true_cc == 1, true_interaction_mode, -1)", "reco_flash_time_mod" = "np.nan_to_num(reco_flash_time, nan=-20)", "reco_category" = "np.where(true_category == 0, reco_reco_interaction_type, -1)"}
area_scale = false
# weight_branch = 'ppfx_cv_weight'


# Output directory for plots
[output]
path = 'plots/'

# Analysis configuration
[analysis]
ordinate_sample = 'NuMIFull'

########################################
## Categories
########################################

category_branch = 'true_category'
category_assignment = [
    [0],
    [1],
    [2],
    [3],
    [4],
    [5],
    [-1]
]
category_labels = ['$\nu_{e}$ Signal', '$\nu_{e}$ OOFV', '$\nu_{\mu}$', '$\nu$ OOFV', '$\nu$ NC', 'Cosmic', 'Data']
category_colors = ['#011959', '#1C5A62', '#687B3E', '#D29343', '#FDB7BC', '#ca80a0ff', '#000000ff']
category_types = ['histogram', 'histogram', 'histogram', 'histogram', 'histogram', 'histogram', 'scatter']

##############################################
## Variables
##############################################

[variables]

[variables.reco_flash_time_mod]
key = 'reco_flash_time_mod'
nbins = 40
range = [-20, 20]
xlabel = 'Reco Flash Time [us]'

[variables.reco_leading_electron_start_x]
key = 'reco_leading_electron_start_x'
nbins = 70
range = [-350, 350]
xlabel = 'Reco Leading Electron Start Position X [cm]'

[variables.reco_leading_electron_start_y]
key = 'reco_leading_electron_start_y'
nbins = 70
range = [-200, 150]
xlabel = 'Reco Leading Electron Start Position Y [cm]'

[variables.reco_leading_electron_start_z]
key = 'reco_leading_electron_start_z'
nbins = 60
range = [-900, 900]
xlabel = 'Reco Leading Electron Start Position Z [cm]'

[variables.reco_electron_multiplicity]
key = 'reco_electron_multiplicity'
nbins = 6
range = [0.0, 6.0]
xlabel = 'Number of Electron-like Particles'

[variables.reco_leading_electron_electron_softmax]
key = 'reco_leading_electron_electron_softmax'
nbins = 50
range = [0.0, 1.0]
xlabel = 'Reco Leading Electron Electron Softmax'

[variables.reco_leading_electron_primary_softmax]
key = 'reco_leading_electron_primary_softmax'
nbins = 50
range = [0.0, 1.0]
xlabel = 'Reco Leading Electron Primary Softmax'

[variables.reco_muon_multiplicity]
key = 'reco_muon_multiplicity'
nbins = 6
range = [0.0, 6.0]
xlabel = 'Number of Muon-like Particles'

[variables.reco_leading_electron_vertex_distance]
key = 'reco_leading_electron_vertex_distance'
nbins = 40
range = [0.0, 10.0]
xlabel = 'Reco Leading Electron Vertex Distance [cm]'

[variables.reco_leading_electron_energy]
key = 'reco_leading_electron_energy'
nbins = 12
range = [0.0, 5000.0]
binning_scheme = 'custom_bins'
custom_bins = [0, 150, 300, 390, 490, 600, 730, 870, 1030, 1240, 1500, 2000, 5000]
xlabel = 'Reco Leading Electron Energy [MeV]'

##############################################
## N-1 Figures (one per selection cut)
##############################################

# Shared cuts block (referenced in each artist below)
# reco_fiducial_cut        → Fiducial Volume
# reco_flash_cut           → Flash Cut
# reco_containment_cut     → Interaction Containment Cut
# reco_has_particle_multiplicity → >=1 Electron-like Particle
# reco_electron_softmax_cut → Leading Electron Electron-Softmax > 0.72
# reco_primary_softmax_cut  → Leading Electron Primary-Softmax > 0.97
# reco_no_muons            → No Muon-like Particles
# reco_vertex_distance_cut → Vertex Distance < 3.25 cm
# reco_leading_ele_energy_cut → Leading Electron Energy > 300 MeV

# ---- Fiducial Volume (X) ----
[[figure]]
name = 'nminus1_fiducial_x'
type = 'SimpleFigure'
style = 'basic_icarus'

[[figure.artists]]
type = 'SpineSpectraNMinus1'
variable = 'reco_leading_electron_start_x'
excluded_cut = 'reco_fiducial_cut'
draw_kwargs = {'show_component_number' = true}

[figure.artists.cuts]
reco_fiducial_cut = 'Fiducial Volume'
reco_flash_cut = 'Flash Cut'
reco_containment_cut = 'Interaction Containment Cut'
reco_has_particle_multiplicity = '>=1 Electron-like Particle'
reco_electron_softmax_cut = 'Leading Electron Electron-Softmax > 0.72'
reco_primary_softmax_cut = 'Leading Electron Primary-Softmax > 0.97'
reco_no_muons = 'No Muon-like Particles'
reco_vertex_distance_cut = 'Vertex Distance < 3.25 cm'
reco_leading_ele_energy_cut = 'Leading Electron Energy > 300 MeV'

