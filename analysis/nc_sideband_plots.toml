# nc_sideband_plots.toml -- plots for the NC pi0 sideband (tree nc_sideband).
# Same samples, exposures and categories as nue_plots.toml, but on the nc_sideband tree
# and its systematic trees (nc_sideband_{multisigma,NuMIfluxsim,variation}Tree; the
# variation tree is the reco_visible_energy detector patch, see CLAUDE.md).
# Run via analysis/plot_jobs_v31.toml (job 'sideband'). Needs the post-stage-5 file
# (merged_final_v31e_flux.root or later). Units: photon energies and pi0 mass MeV,
# visible energy GeV, opening angle rad. Both pi0 mass plots span 0-300 MeV; the reco one is only filled in the 100-180 MeV cut window.

[[this_includes]]
file = '/nashome/m/micarrig/icarus/nuESpine/medulla/spineplot/configurations/common/styles.toml'

[[this_includes]]
file = '/nashome/m/micarrig/icarus/nuESpine/medulla/analysis/systematic_recipes.toml'

[samples]
[samples.NuMIFull]
key = "NuMIFull"
exposure_type = 'pot'
trees = ['nc_sideband']
print_sys = true
systematics = ['nc_sideband_multisigmaTree', 'nc_sideband_NuMIfluxsimTree', 'nc_sideband_variationTree']
precompute = {"reco_flash_time_mod" = "np.nan_to_num(reco_flash_time, nan=-20)", "pi0_mass_diff" = "reco_pi0_invariant_mass - true_pi0_invariant_mass", "visible_energy_diff" = "reco_visible_energy - true_visible_energy", "leading_photon_energy_diff" = "reco_leading_photon_energy - true_leading_photon_energy", "secondary_photon_energy_diff" = "reco_secondary_photon_energy - true_secondary_photon_energy", "photon_opening_angle_diff" = "reco_photon_opening_angle - true_photon_opening_angle"}
area_scale = false
override_exposure = 7.095834e+20

[samples.data]
key = "data"
exposure_type = "pot"
trees = ['nc_sideband']
print_sys = true
systematics = []
precompute = {"reco_flash_time_mod" = "np.nan_to_num(reco_flash_time, nan=-20)", "pi0_mass_diff" = "reco_pi0_invariant_mass - true_pi0_invariant_mass", "visible_energy_diff" = "reco_visible_energy - true_visible_energy", "leading_photon_energy_diff" = "reco_leading_photon_energy - true_leading_photon_energy", "secondary_photon_energy_diff" = "reco_secondary_photon_energy - true_secondary_photon_energy", "photon_opening_angle_diff" = "reco_photon_opening_angle - true_photon_opening_angle", "true_category" = "-1"}
override_exposure = 2.36124e19 # 10% data, same as nue_plots.toml
override_livetime = 483958

[samples.dataBeamOff]
key = "dataBeamOff"
exposure_type = "livetime"
trees = ['nc_sideband']
systematics = []
precompute = {"reco_flash_time_mod" = "np.nan_to_num(reco_flash_time, nan=-20)", "pi0_mass_diff" = "reco_pi0_invariant_mass - true_pi0_invariant_mass", "visible_energy_diff" = "reco_visible_energy - true_visible_energy", "leading_photon_energy_diff" = "reco_leading_photon_energy - true_leading_photon_energy", "secondary_photon_energy_diff" = "reco_secondary_photon_energy - true_secondary_photon_energy", "photon_opening_angle_diff" = "reco_photon_opening_angle - true_photon_opening_angle", "true_category" = "6"}
override_exposure = 50788498

[samples.rockMuon]
key = "rock"
exposure_type = "pot"
trees = ['nc_sideband']
systematics = []
precompute = {"reco_flash_time_mod" = "np.nan_to_num(reco_flash_time, nan=-20)", "pi0_mass_diff" = "reco_pi0_invariant_mass - true_pi0_invariant_mass", "visible_energy_diff" = "reco_visible_energy - true_visible_energy", "leading_photon_energy_diff" = "reco_leading_photon_energy - true_leading_photon_energy", "secondary_photon_energy_diff" = "reco_secondary_photon_energy - true_secondary_photon_energy", "photon_opening_angle_diff" = "reco_photon_opening_angle - true_photon_opening_angle", "true_category" = "7"}

[output]
path = 'plots/'

[analysis]
ordinate_sample = 'data'
category_branch = 'true_category'
category_assignment = [[0], [1], [2], [3], [4], [5], [6], [7], [-1]]
category_labels = ['$\nu_{e}$ Signal', '$\nu_{e}$ OOFV', '$\nu_{\mu}$', '$\nu$ OOFV', '$\nu$ NC', 'Cosmic-OOT', 'Cosmic-IT', 'Rock', 'Data']
category_colors = ['#0072B2', '#770107', '#02694d', '#CC79A7', '#ff7912', '#8B5A2B', '#C9A400', '#6C4BA6', '#000000']
category_types = ['histogram', 'histogram', 'histogram', 'histogram', 'histogram', 'histogram', 'histogram', 'histogram', 'scatter']

[variables]
[variables.reco_pi0_invariant_mass]
key = 'reco_pi0_invariant_mass'
nbins = 30
range = [0.0, 300.0]
xlabel = 'Reco $\pi^0$ Invariant Mass [MeV]'

[variables.true_pi0_invariant_mass]
key = 'true_pi0_invariant_mass'
nbins = 30
range = [0.0, 300.0]
xlabel = 'True $\pi^0$ Invariant Mass [MeV]'

# Same bins as the nc_sideband detector-systematic splines (NuMI_nue_sideband_phase1_ncpi0_v31.toml).
[variables.reco_visible_energy]
key = 'reco_visible_energy'
nbins = 5
range = [0.0, 5.0]
binning_scheme = 'custom_bins'
custom_bins = [0.0, 0.33, 0.48, 0.67, 0.96, 5.0]
xlabel = 'Reco Visible Energy [GeV]'

[variables.true_visible_energy]
key = 'true_visible_energy'
nbins = 5
range = [0.0, 5.0]
binning_scheme = 'custom_bins'
custom_bins = [0.0, 0.33, 0.48, 0.67, 0.96, 5.0]
xlabel = 'True Visible Energy [GeV]'

[variables.reco_leading_photon_energy]
key = 'reco_leading_photon_energy'
nbins = 24
range = [0.0, 1200.0]
xlabel = 'Reco Leading Photon Energy [MeV]'

[variables.true_leading_photon_energy]
key = 'true_leading_photon_energy'
nbins = 24
range = [0.0, 1200.0]
xlabel = 'True Leading Photon Energy [MeV]'

[variables.reco_secondary_photon_energy]
key = 'reco_secondary_photon_energy'
nbins = 24
range = [0.0, 600.0]
xlabel = 'Reco Subleading Photon Energy [MeV]'

[variables.true_secondary_photon_energy]
key = 'true_secondary_photon_energy'
nbins = 24
range = [0.0, 600.0]
xlabel = 'True Subleading Photon Energy [MeV]'

[variables.reco_photon_opening_angle]
key = 'reco_photon_opening_angle'
nbins = 30
range = [0.0, 3.1416]
xlabel = 'Reco Photon Opening Angle [rad]'

[variables.true_photon_opening_angle]
key = 'true_photon_opening_angle'
nbins = 30
range = [0.0, 3.1416]
xlabel = 'True Photon Opening Angle [rad]'

[variables.reco_leading_photon_start_dedx]
key = 'reco_leading_photon_start_dedx'
nbins = 50
range = [0.0, 10.0]
xlabel = 'Reco Leading Photon Start dE/dx [MeV/cm]'

[variables.reco_secondary_photon_start_dedx]
key = 'reco_secondary_photon_start_dedx'
nbins = 50
range = [0.0, 10.0]
xlabel = 'Reco Subleading Photon Start dE/dx [MeV/cm]'

[variables.reco_leading_photon_axial_spread]
key = 'reco_leading_photon_axial_spread'
nbins = 56
range = [-0.4, 1.0]
xlabel = 'Reco Leading Photon Axial Spread'

[variables.reco_secondary_photon_axial_spread]
key = 'reco_secondary_photon_axial_spread'
nbins = 56
range = [-0.4, 1.0]
xlabel = 'Reco Subleading Photon Axial Spread'

[variables.reco_leading_photon_directional_spread]
key = 'reco_leading_photon_directional_spread'
nbins = 25
range = [0.0, 0.5]
xlabel = 'Reco Leading Photon Directional Spread'

[variables.reco_secondary_photon_directional_spread]
key = 'reco_secondary_photon_directional_spread'
nbins = 25
range = [0.0, 0.5]
xlabel = 'Reco Subleading Photon Directional Spread'

[variables.reco_leading_photon_photon_softmax]
key = 'reco_leading_photon_photon_softmax'
nbins = 20
range = [0.0, 1.0]
xlabel = 'Reco Leading Photon Photon-Softmax'

[variables.reco_secondary_photon_photon_softmax]
key = 'reco_secondary_photon_photon_softmax'
nbins = 20
range = [0.0, 1.0]
xlabel = 'Reco Subleading Photon Photon-Softmax'

[variables.reco_leading_photon_primary_softmax]
key = 'reco_leading_photon_primary_softmax'
nbins = 20
range = [0.0, 1.0]
xlabel = 'Reco Leading Photon Primary-Softmax'

[variables.reco_secondary_photon_primary_softmax]
key = 'reco_secondary_photon_primary_softmax'
nbins = 20
range = [0.0, 1.0]
xlabel = 'Reco Subleading Photon Primary-Softmax'

[variables.reco_photon_multiplicity]
key = 'reco_photon_multiplicity'
nbins = 5
range = [0.0, 5.0]
xlabel = 'Number of Photons'

[variables.reco_flash_time_mod]
key = 'reco_flash_time_mod'
nbins = 30
range = [-20.0, 10.0]
xlabel = 'Reco Flash Time [us]'

[variables.true_neutrino_energy]
key = 'true_neutrino_energy'
nbins = 20
range = [0.0, 5.0]
xlabel = 'True Neutrino Energy [GeV]'

[variables.pi0_mass_diff]
key = 'pi0_mass_diff'
nbins = 60
range = [-150.0, 150.0]
xlabel = '$m^{reco}_{\gamma\gamma} - m^{true}_{\gamma\gamma}$ [MeV]'

[variables.visible_energy_diff]
key = 'visible_energy_diff'
nbins = 60
range = [-1.5, 1.5]
xlabel = '$E^{reco}_{vis} - E^{true}_{vis}$ [GeV]'

[variables.leading_photon_energy_diff]
