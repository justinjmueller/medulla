# Output directory for plots
[output]
path = 'plots/'

# Analysis configuration
[analysis]
ordinate_sample = 'NuMIFull'
category_branch = 'reco_category'

category_assignment = [
    [1], # QE-like
    [2], # MEC-like
    [3], # DIS-like
    [4], # RES-like
    [5, 0, -1]  # >1 electron, Other
]
category_labels = ['1e1p0$\pi$ (QE-like)', '1e2p0$\pi$ (MEC-like)', '1e$\geq3p0\pi$ (DIS-like)', '1e1$\pi$ (RES-like)', 'Other']
category_colors = ['#2C194C','#49749F', '#83A1BE', '#8EB38D', '#4F894E', '#1C5B19', '#0F2903'] #cork

# category_assignment = [
#     [0], # QE
#     [1], # RES
#     [2], # DIS
#     [10], # MEC
#     [3, -1]  # COH, Other
# ]
# category_labels = ['QE', 'RES', 'DIS', 'MEC', 'Other']
# category_colors = ['#001261', '#1E6F9D', '#BE6533', '#8B2706', '#590008', '#000000ff']

category_types = ['histogram', 'histogram', 'histogram', 'histogram', 'histogram', 'histogram']

