# Define your samples
[samples]
[samples.NuMIFull]
key = "NuMIFull"
exposure_type = "pot"
trees = ['true_signal']
# systematics = ['true_signal_multisimTree', 'true_signal_multisigmaTree', 'true_signal_NuMIFluxsimTree']
systematics = ['true_signal_NuMIfluxsimTree', 'true_signal_multisigmaTree']
branches = ["reco_fiducial_cut",
            "reco_flash_cut",
            "true_category",
            "true_neutrino_energy",
            "reco_ele_beam_open_angle",
            "reco_leading_electron_energy",
            "reco_containment_cut",
            "reco_has_particle_multiplicity",
            "reco_no_muons",
            "reco_vertex_distance_cut",
            "reco_track_length",
            "reco_electron_softmax_cut",
            "reco_primary_softmax_cut",
            "reco_leading_ele_energy_cut",
            "reco_reco_interaction_type",
            "true_hadronic_invariant_mass",
            "true_momentum_transfer",
            "true_interaction_mode",
            "true_ele_beam_open_angle",
            "true_leading_electron_energy"]

precompute = {"reco_category" = "np.where(true_category == 0, reco_reco_interaction_type, -1)", "reco_ele_beam_cosTheta" = "np.where(reco_ele_beam_open_angle != 10, np.cos(reco_ele_beam_open_angle), -10)", "true_ele_beam_cosTheta" = "np.where(true_ele_beam_open_angle != 10, np.cos(true_ele_beam_open_angle), -10)"}
# precompute = {"reco_category" = "np.where(true_category == 0, true_interaction_mode, -1)", "reco_ele_beam_cosTheta" = "np.where(reco_ele_beam_open_angle != 10, np.cos(reco_ele_beam_open_angle), -10)", "true_ele_beam_cosTheta" = "np.where(reco_ele_beam_open_angle != 10, np.cos(reco_ele_beam_open_angle), -10)"}

