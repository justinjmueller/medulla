# plot_jobs_v32.toml -- plot jobs for the v32 processing (first one with the all_nc truth tree
# and the reco/true no_electrons, two_photons, pi0_invariant_mass_cut branches).
# The input path is the expected v32 post-stage-5 file; plot_all.py skips a job whose input is
# missing. Copy the other jobs from plot_jobs_v31.toml here when v32 is processed.
# Run: python3 analysis/plot_all.py --manifest analysis/plot_jobs_v32.toml [--only ...] [--dry-run]

# Disabled 2026-11-03: the all_nc truth tree was removed from the selection TOMLs (the
# sideband is now a background control region, photon_sideband, with no efficiency of its
# own). Kept for reference; it needs a processing that still has all_nc.
# # NC pi0 sideband selection efficiency (all_nc + true fiducial/containment as denominator).
# [[job]]
# name = "efficiency_nc_sideband"
# cli = "analysis/plotEfficiencyCLI.py"
# toml = "analysis/efficiency_nc_sideband.toml"
# input = "/exp/icarus/data/users/micarrig/merged_final_v32_flux.root"
# output_dir = "plots_v32/efficiency_nc_sideband"
# figures = ["selection_efficiency_table", "efficiency_vs_trueVisibleEnergy", "efficiency_vs_truePi0Mass",
#            "efficiency_vs_trueLeadingPhotonEnergy", "efficiency_vs_trueNeutrinoEnergy"]

# Photon sideband plots on the final v32 file (merged_final_v32b_flux.root = post-stage-5 file
# with events/NuMIFull/photon_sideband_variationTree grafted in).

[[job]]
name = "photon_sideband"
cli = "analysis/makeSelectionPlotsCLI.py"
toml = "analysis/photon_sideband_plots.toml"
input = "/exp/icarus/data/users/micarrig/merged_final_v32b_flux.root"
output_dir = "plots_v32/photon_sideband_plots"
figures = ["reco_pi0_invariant_mass", "true_pi0_invariant_mass", "reco_visible_energy", "true_visible_energy", "reco_leading_photon_energy", "true_leading_photon_energy", "reco_secondary_photon_energy", "true_secondary_photon_energy", "reco_photon_opening_angle", "true_photon_opening_angle", "reco_leading_photon_start_dedx", "reco_secondary_photon_start_dedx", "reco_leading_photon_axial_spread", "reco_secondary_photon_axial_spread", "reco_leading_photon_directional_spread", "reco_secondary_photon_directional_spread", "reco_leading_photon_photon_softmax", "reco_secondary_photon_photon_softmax", "reco_leading_photon_primary_softmax", "reco_secondary_photon_primary_softmax", "reco_photon_multiplicity", "reco_flash_time_mod", "true_neutrino_energy", "pi0_mass_diff", "visible_energy_diff", "leading_photon_energy_diff", "secondary_photon_energy_diff", "photon_opening_angle_diff", "true_vs_reco_pi0_invariant_mass", "true_vs_reco_visible_energy", "true_vs_reco_leading_photon_energy", "true_vs_reco_secondary_photon_energy", "true_vs_reco_photon_opening_angle"]

# Jobs copied from plot_jobs_v31.toml on 2026-11-11 (all but the nc_sideband one), input switched to
# merged_final_v32b_flux.root and outputs to plots_v32/. Plus systematic_g4 (systematics.toml
# already reads the v32 g4 file, merged_final_g4_v32_flux.root).

[[job]]
name = "selection"
cli = "analysis/makeSelectionPlotsCLI.py"
toml = "analysis/nue_plots.toml"
input = "/exp/icarus/data/users/micarrig/merged_final_v32b_flux.root"
output_dir = "plots_v32/selection"

# Same selection plots, split by reco interaction category (reco_category).
[[job]]
name = "selection_reco"
cli = "analysis/makeSelectionPlotsCLI.py"
toml = "analysis/nue_plots_reco.toml"
input = "/exp/icarus/data/users/micarrig/merged_final_v32b_flux.root"
output_dir = "plots_v32/selection_reco"

# One systematics run per breakdown. `args` passes --systematics-set, which
# overrides every SpineSystematics artist's `systematics` with the named set in
# analysis/systematic_sets.toml (membership lifted verbatim from systematics.toml).
[[job]]
name = "systematic_xsec"
cli = "analysis/makeSystematicPlotsCLI.py"
toml = "analysis/systematics.toml"
input = "/exp/icarus/data/users/micarrig/merged_final_v32b_flux.root"
output_dir = "plots_v32/systematics_xsec"
args = ["--systematics-set", "xsec"]

