label = 'MEC'
pattern = '^(NormCCMEC|NormNCMEC|DecayAngMEC)$'

[[systematic_recipe]]
name = 'xsec_res'
label = 'Resonant'
pattern = '^(MaCCRES|MvCCRES|MaNCRES|MvNCRES)$'

[[systematic_recipe]]
