pattern = '^(MFP_pi|FrCEx_pi|FrInel_pi|FrAbs_pi|FrPiProd_pi|MFP_N|FrCEx_N|FrInel_N|FrAbs_N|FrPiProd_N)$'

[[systematic_recipe]]
name = 'xsec_other'
label = 'Other'
pattern = '^(MaNCEL|EtaNCEL|RDECBR1gamma|RDECBR1eta|Theta_Delta2Npi|ThetaDelta2NRad)$'

[[systematic_recipe]]
name = 'xsec_total'
label = 'XSec'
pattern = '^(xsec_ccqe|xsec_mec|xsec_res|xsec_dis|xsec_coh|xsec_nonres|xsec_fsi|xsec_other)$'

