# systematic_sets.toml -- named systematic breakdowns for makeSystematicPlotsCLI.py
# (--systematics-set <name>) and plot_all.py.
#
# Each entry under [sets] is one `systematics = [...]` list lifted VERBATIM from
# the SpineSystematics artists in analysis/systematics.toml (the active xsec list
# and the three commented-out alternatives), so the CLI can produce each
# breakdown in its own run without hand-editing systematics.toml.
#
# REVIEW BEFORE A REAL RUN: the membership here is the physics definition of each
# breakdown. `total` references aggregate names ('flux', 'xsec_total', 'detector',
# 'total_stat') rather than individual knobs; confirm those resolve in spineplot.
# `xsec_grouped` is the older commented recipe-name form of xsec; `xsec` is the
# full individual-knob list that is currently active in systematics.toml.

[sets]

xsec_grouped = ["xsec_ccqe", "xsec_mec", "xsec_res", "xsec_dis", "xsec_coh", "xsec_nonres", "xsec_fsi", "xsec_other"]

