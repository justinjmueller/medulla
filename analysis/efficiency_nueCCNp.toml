
[[this_includes]]
file = '/nashome/m/micarrig/icarus/nuESpine/medulla/spineplot/configurations/common/styles.toml'

# Define your samples
[samples]
[samples.signal]
key = "signal"
exposure_type = "pot"
trees = ['true_signal']
branches = ["reco_fiducial_cut",
            "reco_flash_cut",
            "true_category",
            "true_neutrino_energy",
            "reco_ele_beam_open_angle",
            "reco_leading_electron_energy",
            "reco_containment_cut",
            "reco_has_electron",
            "reco_has_proton",
            "reco_no_muons",
            "reco_no_charged_pions",
            "reco_vertex_distance_cut",
            "reco_track_length",
            "reco_electron_softmax_cut",
            "reco_primary_softmax_cut",
            "reco_leading_ele_energy_cut",
            "reco_reco_interaction_type",
            "true_hadronic_invariant_mass",
            "true_momentum_transfer",
            "reco_flash_time",
            "reco_leading_proton_proton_softmax",
            "reco_leading_electron_axial_spread",
            "reco_leading_photon_energy",
            "reco_leading_electron_ke",
            "reco_leading_proton_ke",
            "reco_valid_flashmatch",
            "reco_leading_muon_ke",
            "reco_leading_pion_ke",
            "reco_leading_electron_start_dedx",
            "reco_leading_electron_electron_softmax",
            "reco_leading_electron_primary_softmax",
            "reco_leading_proton_primary_softmax",
            "reco_leading_electron_vertex_distance",
            "reco_dalphaT",
            "reco_dpT",
            "reco_leading_electron_polar_angle",
            "reco_opening_angle",
            "true_leading_electron_energy",
            "true_ele_beam_open_angle",
            "true_dalphaT",
            "true_dpT",
            "true_leading_electron_polar_angle",
            "true_opening_angle",
            ]

#precompute = {"reco_leading_electron_electron_softmax_cut" = "reco_leading_electron_electron_softmax > 0.72", "reco_leading_electron_primary_softmax_cut" = "reco_leading_electron_primary_softmax > 0.97"}
precompute = {"true_opening_angle_cos" = "np.cos(true_opening_angle)", "true_leading_electron_cos" = "np.cos(true_leading_electron_polar_angle)", "reco_leading_proton_proton_softmax_cut" = "reco_leading_proton_proton_softmax > 0.75", "reco_leading_electron_axial_spread_cut" = "reco_leading_electron_axial_spread > 0.1", "reco_leading_photon_energy_cut" = "np.where((reco_leading_photon_energy < 50) | np.isnan(reco_leading_photon_energy), True, False)", "reco_leading_muon_cut" = "np.where((reco_leading_muon_ke < 25) | np.isnan(reco_leading_muon_ke), True, False)", "reco_leading_pion_cut" = "np.where((reco_leading_pion_ke < 25) | np.isnan(reco_leading_pion_ke), True, False)", "reco_leading_electron_cut" = "reco_leading_electron_ke > 75", "electron_softmax_cut" = "reco_leading_electron_electron_softmax > 0.90", "electron_primary_softmax_cut" = "reco_leading_electron_primary_softmax > 0.99", "proton_softmax_cut" = "reco_leading_proton_proton_softmax > 0.75", "vertex_distance_cut" = "reco_leading_electron_vertex_distance < 3.5", "dedx_cut" = "reco_leading_electron_start_dedx < 4", "reco_leading_proton_cut" = "reco_leading_proton_ke > 40"}

# Output directory for plots
[output]
path = 'plots/'

# Analysis configuration
[analysis]
ordinate_sample = 'signal'
category_branch = 'true_category'
category_assignment = [
    [0, 1], # CC nue
    [2, 3, 4, 5, 6, 7, 8, 9, 10], 
]
category_labels = ['Signal', 'Background']

category_colors = ['C0', 'C1', 'C2', 'C3', 'C4', 'C5', 'C6', 'C7', 'C8', 'C9', 'C10']
category_types = ['histogram', 'histogram', 'histogram', 'histogram', 'histogram', 'histogram', 'histogram', 'histogram', 'histogram', 'histogram', 'histogram']
# category_colors = ['#001261', '#033E7D', '#1E6F9D', '#71A8C4', '#C9DDE7', '#EACEBD', '#D39774', '#BE6533', '#8B2706', '#590008', '#000000'] #vik

# Define your variables (if not already in included variables.toml)
[variables]
[variables.true_neutrino_energy]
key = 'true_neutrino_energy'  
nbins = 20
range = [0, 5]
xlabel = 'True Neutrino Energy [GeV]'

[variables.reco_ele_beam_open_angle]
key = 'reco_ele_beam_open_angle'
nbins = 42
range = [-1.0, 3.2]
#binning_scheme = 'custom_bins'
#custom_bins = [0.0, 0.275, 0.42, 0.55, 0.68, 0.825, 1.0, 1.25, 1.7, 3.2]
xlabel = "Reco Leading Electron Open Angle (NuMI) [rad]"

[variables.true_ele_beam_open_angle]
key = 'true_ele_beam_open_angle'
nbins = 42
range = [-1.0, 3.2]
#binning_scheme = 'custom_bins'
#custom_bins = [0.0, 0.275, 0.42, 0.55, 0.68, 0.825, 1.0, 1.25, 1.7, 3.2]
xlabel = "True Leading Electron Open Angle (NuMI) [rad]"

[variables.reco_leading_electron_energy]
key = 'reco_leading_electron_energy'
nbins = 11
range = [-1.0, 5000.0]
binning_scheme = 'custom_bins'
custom_bins = [-1, 0, 225, 350, 500, 650, 800, 1000, 1250, 1500, 2000, 5000]
xlabel = 'Reco Leading Electron Energy [MeV]'

[variables.true_leading_electron_energy]
key = 'true_leading_electron_energy'
nbins = 11
range = [-1.0, 5000.0]
binning_scheme = 'custom_bins'
custom_bins = [-1, 0, 225, 350, 500, 650, 800, 1000, 1250, 1500, 2000, 5000]
xlabel = 'True Leading Electron Energy [MeV]'

[variables.true_hadronic_invariant_mass]
key = 'true_hadronic_invariant_mass'
nbins = 5
range = [0.5, 2.0]
xlabel = 'True Hadronic Invariant Mass (W) [GeV]'

[variables.true_momentum_transfer]
key = 'true_momentum_transfer'
nbins = 12
range = [0.0, 2.4]
xlabel = 'True Momentum Transfer ($Q^{2}$) [GeV$^{2}$]'

[variables.reco_dalphaT]
key = 'reco_dalphaT'
nbins = 33
range = [0.0, 3.3]
xlabel = 'Reco dalphaT'

[variables.true_dalphaT]
    key = 'true_dalphaT'
    nbins = 33
range = [0.0, 3.3]
xlabel = 'True dalphaT'

[variables.reco_dpT]
key = 'reco_dpT'
nbins = 25
range = [0, 1250]
xlabel = 'Reco dpT'

[variables.true_dpT]
key = 'true_dpT'
nbins = 25
range = [0, 1250]
xlabel = 'True dpT'

[variables.reco_leading_electron_polar_angle]
key = 'reco_leading_electron_polar_angle'
nbins = 32
range = [0.0, 3.2]
xlabel = 'Reco Leading Electron Polar Angle'

[variables.true_leading_electron_cos]
key = 'true_leading_electron_cos'
nbins = 20
range = [-1.0, 1.0]
xlabel = 'True Leading Electron cos$\theta$'

[variables.reco_opening_angle]
key = 'reco_opening_angle'
nbins = 32
range = [0.0, 3.2]
xlabel = 'Reco Opening Angle between Leading Electron and Leading Proton'

[variables.true_opening_angle_cos]
key = 'true_opening_angle_cos'
nbins = 20
range = [-1.0, 1.0]
xlabel = 'True cos$\theta_{e-p}$'

# Create efficiency plot figures
[[figure]]
name = 'selection_efficiency_table'
type = 'SimpleFigure'
style = 'basic_sbnd'  # This references a style defined in the included styles.toml
title = 'Signal Selection Efficiency'

[[figure.artists]]
type = 'SpineEfficiency'
variable = 'reco_leading_electron_energy'
groups = ['Signal']

[figure.artists.cuts]
reco_fiducial_cut = 'Fiducial Volume'
reco_flash_cut = 'Flash Cut'
reco_containment_cut = 'Interaction Containment Cut'
reco_leading_muon_cut = 'No Muon-like Particles > 25 MeV'
reco_leading_pion_cut = 'No Charged Pion-like Particles > 25 MeV'
reco_leading_proton_cut = '>= 1 40 MeV Proton-like Particle'
reco_leading_electron_cut = '>= 1 75 MeV Electron-like Particle'
electron_primary_softmax_cut = 'Electron Primary Softmax > 0.99'
electron_softmax_cut = 'Leading Electron Softmax > 0.90'
proton_softmax_cut = 'Leading Proton Softmax > 0.75'
vertex_distance_cut = 'Vertex Distance < 3.5 cm'
dedx_cut = "Leading Electron dE/dx < 4 MeV/cm"

# reco_leading_electron_axial_spread_cut = 'Electron Axial Spread > 0.1'
# reco_leading_photon_energy_cut = 'Leading Photon Energy < 50 MeV'
# reco_leading_electron_momentum_cut = 'Leading Electron Momentum > 300 MeV'
# reco_leading_proton_momentum_cut = 'Leading Proton Momentum > 300 MeV'

[figure.artists.draw_kwargs]
show_option = 'table'
percentage = true
show_seqeff = true
show_unseqeff = true
show_purity = true
show_counts = true

# FIGURE 2: Efficiency vs Neutrino Energy Plot 
[[figure]]
name = 'efficiency_vs_energy'
type = 'SimpleFigure'
style = 'basic_sbnd'
title = 'Selection Efficiency vs True Neutrino Energy'

[[figure.artists]]
type = 'SpineEfficiency'
variable = 'true_neutrino_energy'
groups = ['Signal']  # Can show both: ['Signal', 'Backgrounds']
xrange = [0, 5]
xtitle = 'True Neutrino Energy [GeV]'

[figure.artists.cuts]
reco_fiducial_cut = 'Fiducial Volume'
reco_flash_cut = 'Flash Cut'
reco_containment_cut = 'Interaction Containment Cut'
reco_leading_muon_cut = 'No Muon-like Particles > 25 MeV'
