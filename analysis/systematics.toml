systematics = ['flux', 'xsec_total', 'total_stat'] # total systematics

[figure.artists.draw_kwargs]
mode       = "fractional"  # "fractional" (sigma/N per bin) or "absolute" (sigma per bin)
show_total = true           # overlay quadrature sum as dashed black line
show_stat  = true          # include statistical uncertainty
logy       = false

