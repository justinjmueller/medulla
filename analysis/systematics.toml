#                'NonRESBGvpNC2pi', 'NonRESBGvnNC2pi', 'NonRESBGvbarpNC2pi', 'NonRESBGvbarnNC2pi', 'MFP_pi', 'FrCEx_pi', 
#                'FrInel_pi', 'FrAbs_pi', 'FrPiProd_pi', 'MFP_N', 'FrCEx_N', 'FrInel_N', 'FrAbs_N', 'FrPiProd_N', 'MaNCEL', 
