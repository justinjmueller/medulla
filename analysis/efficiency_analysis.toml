
[[this_includes]]
file = '/nashome/m/micarrig/icarus/nuESpine/medulla/spineplot/configurations/common/styles.toml'

[[this_includes]]
file = '/nashome/m/micarrig/icarus/nuESpine/medulla/analysis/systematic_recipes.toml'

# Define your samples
[samples]
[samples.NuMIFull]
key = "NuMIFull"
exposure_type = "pot"
trees = ['true_signal']
systematics = []
branches = ["reco_fiducial_cut",
            "reco_flash_cut",
            "true_category",
            "true_neutrino_energy",
            "reco_leading_electron_ke",
            "reco_ele_beam_open_angle",
            "reco_leading_electron_energy",
            "reco_containment_cut",
            "reco_has_particle_multiplicity",
            "reco_no_muons",
            "reco_vertex_distance_cut",
            "reco_track_length",
            "reco_electron_softmax_cut",
            "reco_primary_softmax_cut",
            "reco_leading_ele_energy_cut",
            "reco_reco_interaction_type",
            "true_hadronic_invariant_mass",
            "true_momentum_transfer",
            "reco_flash_time",
            "true_leading_electron_energy",
            "true_ele_beam_open_angle",
            "reco_visible_energy",
            "true_visible_energy"
            ]
precompute = {"reco_ele_beam_cosTheta" = "np.where(reco_ele_beam_open_angle != 10, np.cos(reco_ele_beam_open_angle), -10)", "reco_flash_time_mod" = "np.nan_to_num(reco_flash_time, nan=-20)", "true_ele_beam_cosTheta" = "np.where(true_ele_beam_open_angle != 10, np.cos(true_ele_beam_open_angle), -10)", "reco_nu" = "reco_visible_energy - reco_leading_electron_energy/1000", "true_nu" = "true_visible_energy - true_leading_electron_energy/1000"}

[samples.NuMIFullNonSel]
key = "NuMIFull"
exposure_type = "pot"
trees = ['true_signal']
systematics = []
branches = ["reco_fiducial_cut",
            "reco_flash_cut",
            "true_category",
            "true_neutrino_energy",
            "reco_leading_electron_ke",
            "reco_ele_beam_open_angle",
            "reco_leading_electron_energy",
            "reco_containment_cut",
            "reco_has_particle_multiplicity",
            "reco_no_muons",
            "reco_vertex_distance_cut",
            "reco_track_length",
            "reco_electron_softmax_cut",
            "reco_primary_softmax_cut",
            "reco_leading_ele_energy_cut",
            "reco_reco_interaction_type",
            "true_hadronic_invariant_mass",
            "true_momentum_transfer",
            "reco_flash_time",
            "true_leading_electron_energy",
            "true_ele_beam_open_angle",
            "reco_visible_energy",
            "true_visible_energy"
            ]
precompute = {"reco_ele_beam_cosTheta" = "np.where(reco_ele_beam_open_angle != 10, np.cos(reco_ele_beam_open_angle), -10)", "reco_flash_time_mod" = "np.nan_to_num(reco_flash_time, nan=-20)", "true_ele_beam_cosTheta" = "np.where(true_ele_beam_open_angle != 10, np.cos(true_ele_beam_open_angle), -10)", "reco_nu" = "reco_visible_energy - reco_leading_electron_energy/1000", "true_nu" = "true_visible_energy - true_leading_electron_energy/1000"}

# Output directory for plots
[output]
path = 'plots/'

# Analysis configuration
[analysis]
ordinate_sample = 'NuMIFull'
category_branch = 'true_category'
category_assignment = [
    [0], # CC nue
    #[1, 2, 3, 4], 
]
category_labels = ['Signal', 'Background']

category_colors = ['C0', 'C1', 'C2', 'C3', 'C4']
category_types = ['histogram', 'histogram', 'histogram', 'histogram', 'histogram']

# Define your variables (if not already in included variables.toml)
[variables]
[variables.true_neutrino_energy]
key = 'true_neutrino_energy'  
nbins = 20
range = [0, 5]
xlabel = 'True Neutrino Energy [GeV]'

[variables.reco_ele_beam_open_angle]
key = 'reco_ele_beam_open_angle'
nbins = 42
range = [-1.0, 3.2]
#binning_scheme = 'custom_bins'
#custom_bins = [0.0, 0.275, 0.42, 0.55, 0.68, 0.825, 1.0, 1.25, 1.7, 3.2]
xlabel = "Reco Leading Electron Open Angle (NuMI) [rad]"

[variables.reco_ele_beam_cosTheta]
key = 'reco_ele_beam_cosTheta'
nbins = 13
binning_scheme = 'custom_bins'
custom_bins = [-1.0, -0.4, 0.0, 0.2, 0.35, 0.5, 0.625, 0.725, 0.8, 0.85, 0.9, 0.94, 0.97, 1.0]
range = [-1.0, 1.0]
xlabel = "Reco Leading Electron $cos{\theta_{NUMI}}$"

[variables.reco_leading_electron_energy]
key = 'reco_leading_electron_energy'
nbins = 9
range = [225.0, 5000.0]
binning_scheme = 'custom_bins'
custom_bins = [225, 350, 500, 650, 800, 1000, 1250, 1500, 2000, 5000]
xlabel = 'Reco Leading Electron Energy [MeV]'

[variables.true_hadronic_invariant_mass]
key = 'true_hadronic_invariant_mass'
nbins = 5
range = [0.5, 2.0]
xlabel = 'True Hadronic Invariant Mass (W) [GeV]'

[variables.true_momentum_transfer]
key = 'true_momentum_transfer'
nbins = 12
range = [0.0, 2.4]
xlabel = 'True Momentum Transfer ($Q^{2}$) [GeV$^{2}$]'

[variables.reco_flash_time_mod]
key = 'reco_flash_time_mod'
nbins = 30
range = [-20, 10]
xlabel = 'Reco Flash Time [us]'

[variables.true_leading_electron_energy]
key = 'true_leading_electron_energy'
nbins = 9
range = [225.0, 5000.0]
binning_scheme = 'custom_bins'
custom_bins = [225, 350, 500, 650, 800, 1000, 1250, 1500, 2000, 5000]
xlabel = 'True Leading Electron Energy [MeV]'

[variables.true_ele_beam_cosTheta]
key = 'true_ele_beam_cosTheta'
nbins = 13
binning_scheme = 'custom_bins'
custom_bins = [-1.0, -0.4, 0.0, 0.2, 0.35, 0.5, 0.625, 0.725, 0.8, 0.85, 0.9, 0.94, 0.97, 1.0]
range = [-1.0, 1.0]
xlabel = "True Leading Electron $cos{\theta_{NUMI}}$"

[variables.reco_nu]
key = 'reco_nu'
nbins = 24
range = [-1, 5]
xlabel = 'Reco Neutrino Energy [GeV]'

[variables.true_nu]
key = 'true_nu'
nbins = 24
range = [-1, 5]
xlabel = 'True Neutrino Energy [GeV]'

# Create efficiency plot figures
[[figure]]
name = 'selection_efficiency_table'
type = 'SimpleFigure'
style = 'basic_icarus'  # This references a style defined in the included styles.toml
title = 'Signal Selection Efficiency'

[[figure.artists]]
type = 'SpineEfficiency'
variable = 'reco_leading_electron_energy'
groups = ['Signal', 'Background']

[figure.artists.cuts]
reco_fiducial_cut = 'Fiducial Volume'
reco_flash_cut = 'Flash Cut'
reco_containment_cut = 'Interaction Containment Cut'
reco_has_particle_multiplicity = '>=1 Electron-like Particle'
reco_electron_softmax_cut = 'Leading Electron Electron-Softmax > 0.72'
reco_primary_softmax_cut = 'Leading Electron Primary-Softmax > 0.97'
reco_no_muons = 'No Muon-like Particles'
reco_vertex_distance_cut = 'Vertex Distance < 3.25 cm'
reco_leading_ele_energy_cut = 'Leading Electron Energy > 225 MeV'

[figure.artists.draw_kwargs]
show_option = 'table'
percentage = true
show_seqeff = true
show_unseqeff = true
show_purity = true
show_counts = true

# FIGURE 2: Efficiency vs Neutrino Energy Plot 
[[figure]]
name = 'efficiency_vs_energy'
type = 'SimpleFigure'
style = 'basic_icarus'
title = 'Selection Efficiency vs True Neutrino Energy'

[[figure.artists]]
type = 'SpineEfficiency'
variable = 'true_neutrino_energy'
groups = ['Signal']  # Can show both: ['Signal', 'Backgrounds']
xrange = [0, 5]
xtitle = 'True Neutrino Energy [GeV]'

[figure.artists.cuts]
reco_fiducial_cut = 'Fiducial Volume'
reco_flash_cut = 'Flash Cut'
reco_containment_cut = 'Interaction Containment Cut'
reco_has_particle_multiplicity = '>=1 Electron-like Particle'
reco_electron_softmax_cut = 'Leading Electron Electron-Softmax > 0.72'
reco_primary_softmax_cut = 'Leading Electron Primary-Softmax > 0.97'
reco_no_muons = 'No Muon-like Particles'
reco_vertex_distance_cut = 'Vertex Distance < 3.25 cm'
reco_leading_ele_energy_cut = 'Leading Electron Energy > 225 MeV'

[figure.artists.draw_kwargs]
show_option = 'differential'  # KEY: This makes it a plot vs energy!
percentage = true
show_seqeff = true     # Show cumulative efficiency curve
show_unseqeff = false  # Don't show individual cut curves

