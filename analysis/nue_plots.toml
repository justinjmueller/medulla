
[[this_includes]]
file = '/nashome/m/micarrig/icarus/nuESpine/medulla/spineplot/configurations/common/styles.toml'

# Define your samples
[samples]
[samples.debugMC]
key = "debugMC"
exposure_type = "pot"
trees = ['all']

precompute = {"reco_ele_beam_cosTheta" = "np.cos(reco_ele_beam_open_angle)", "true_ele_beam_cosTheta" = "np.cos(true_ele_beam_open_angle)", "reco_category" = "np.where(true_cc == 1, true_interaction_mode, -1)", "reco_flash_time_mod" = "np.nan_to_num(reco_flash_time, nan=-20)"}

# Output directory for plots
[output]
path = 'plots/'

# Analysis configuration
[analysis]
ordinate_sample = 'debugMC'

