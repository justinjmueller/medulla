# plot_jobs_v31.toml -- v31 copy of plot_jobs.toml (generated 2026-10-22): same jobs, input
# /exp/icarus/data/users/micarrig/merged_final_v31e_flux.root (post-stage-5, with the nc_sideband
# detector patch), outputs under plots_v31/, plus the 'sideband' job at the end.
# Run: python3 analysis/plot_all.py --manifest analysis/plot_jobs_v31.toml [--only ...] [--dry-run]

# plot_jobs.toml -- the plotting jobs that analysis/plot_all.py runs.
#
# Each [[job]] is ONE CLI invocation. The variant matrix lives here, not in code:
# to plot the same TOML a second way, add another [[job]] with the same `toml`
# and a different `figures` subset and/or `output_dir`. Fields:
#   name        unique job label (used by `plot_all.py --only <name> ...`)
#   cli         plotting CLI, relative to the repo root
#   toml        analysis TOML
#   input       input ROOT file (job is skipped with a warning if it is missing)
#   output_dir  where the png/pkl (or efficiency figures) are written
#   figures     OPTIONAL list of figure/variable names; omit to use the CLI default
#   args        OPTIONAL extra CLI flags appended verbatim (e.g. ["--systematics-set", "xsec"])
#
# plot_all.py runs these one at a time (memory is released between jobs) and only
# when this node's available memory comfortably exceeds the input size.

[[job]]
name = "selection"
cli = "analysis/makeSelectionPlotsCLI.py"
toml = "analysis/nue_plots.toml"
input = "/exp/icarus/data/users/micarrig/merged_final_v31e_flux.root"
output_dir = "plots_v31/selection"

# Same selection plots, split by reco interaction category (reco_category).
[[job]]
name = "selection_reco"
cli = "analysis/makeSelectionPlotsCLI.py"
toml = "analysis/nue_plots_reco.toml"
input = "/exp/icarus/data/users/micarrig/merged_final_v31e_flux.root"
output_dir = "plots_v31/selection_reco"

# One systematics run per breakdown. `args` passes --systematics-set, which
# overrides every SpineSystematics artist's `systematics` with the named set in
# analysis/systematic_sets.toml (membership lifted verbatim from systematics.toml).
[[job]]
name = "systematic_xsec"
cli = "analysis/makeSystematicPlotsCLI.py"
toml = "analysis/systematics.toml"
input = "/exp/icarus/data/users/micarrig/merged_final_v31e_flux.root"
output_dir = "plots_v31/systematics_xsec"
args = ["--systematics-set", "xsec"]

[[job]]
